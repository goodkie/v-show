<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloudflare Turnstile Official Test Key — Invisible Fail</title>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #0b0f19; color: #e2e8f0; padding: 24px; }
        .card { max-width: 520px; margin: 0 auto; background: #161e2e; border: 1px solid #f97316; border-radius: 8px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #fb923c; font-size: 18px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        input, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 8px 10px; border-radius: 4px; font-size: 13px; }
        textarea { height: 70px; resize: vertical; }
        button { background: #ea580c; color: #fff; font-weight: bold; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px; margin-top: 14px; }
        button:hover { background: #c2410c; }
        #siteverify-result-container { display: none; margin-top: 16px; background: #0f172a; border: 1px solid #f97316; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 11px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Cloudflare Turnstile Official Lab — Invisible Fail</h2>
        <p style="font-size: 12px; color: #94a3b8;">Sitekey: <code>2x00000000000000000000BB</code> (Invisible, Always Fails)</p>
        <form id="contact-form" method="POST" action="/cf-turnstile/verify?case=invisible-fail">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" required placeholder="Inquiry">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required placeholder="Your message here..."></textarea>
            </div>
            <div class="cf-turnstile" data-sitekey="2x00000000000000000000BB" data-size="invisible"></div>
            <button type="submit" id="submit-btn">Submit Inquiry</button>
        </form>
        <div id="siteverify-result-container">
            <div style="font-weight: bold; color: #fb923c; margin-bottom: 6px;">SERVER SITEVERIFY RESULT:</div>
            <pre id="siteverify-result" style="margin: 0; white-space: pre-wrap; color: #cbd5e1;"></pre>
        </div>
    </div>
    <script>
        const form = document.getElementById('contact-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Verifying with Server...';

            const formData = new FormData(form);
            const token = formData.get('cf-turnstile-response') || '';

            try {
                const res = await fetch('/cf-turnstile/verify?case=invisible-fail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        token,
                        caseKey: 'invisible-fail',
                        name: formData.get('name'),
                        email: formData.get('email'),
                        message: formData.get('message')
                    })
                });
                const data = await res.json();
                window.__siteverify_result = data;

                const container = document.getElementById('siteverify-result-container');
                const pre = document.getElementById('siteverify-result');
                container.style.display = 'block';
                pre.textContent = JSON.stringify(data, null, 2);
                btn.textContent = data.verified ? 'Submitted & Verified' : 'Expected Fail Verified';
            } catch (err) {
                window.__siteverify_result = { verified: false, error: err.message };
                btn.textContent = 'Submission Error';
            }
        });
    </script>
</body>
</html>
