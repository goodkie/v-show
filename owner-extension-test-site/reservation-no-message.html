<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Table Booking & Reservation</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; color: #38bdf8; margin-top: 0; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input[type="text"], input[type="date"], input[type="time"], select { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 10px 12px; color: #f8fafc; font-size: 14px; outline: none; }
        input:focus, select:focus { border-color: #38bdf8; }
        button[type="submit"] { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
        .badge { display: inline-block; background: rgba(234, 179, 8, 0.15); border: 1px solid #eab308; color: #facc15; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin-top: 20px; font-weight: 500; text-align: center; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Book an Appointment / Reservation</h1>
        <p>Select your preferred reservation date, arrival time, and party size.</p>

        <!-- Pure booking form without inquiry body field -->
        <form id="booking-form" action="#" method="POST">
            <div class="form-group">
                <label for="guest_name">Lead Guest Name *</label>
                <input type="text" id="guest_name" name="guest_name" required placeholder="Guest Name">
            </div>

            <div class="form-group">
                <label for="reservation_date">Reservation Date *</label>
                <input type="date" id="reservation_date" name="reservation_date" required>
            </div>

            <div class="form-group">
                <label for="reservation_time">Preferred Time *</label>
                <input type="time" id="reservation_time" name="reservation_time" required>
            </div>

            <div class="form-group">
                <label for="party_size">Party Size *</label>
                <select id="party_size" name="party_size" required>
                    <option value="1">1 Person</option>
                    <option value="2" selected>2 People</option>
                    <option value="4">4 People</option>
                    <option value="6">6+ People</option>
                </select>
            </div>

            <button type="submit" id="book-btn">Confirm Reservation Booking</button>
        </form>

        <div class="badge">
            ℹ️ Intent Classification: Negative Booking Form (Expected: SKIPPED)
        </div>
    </div>
</body>
</html>
