<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CAPTCHA Lab CAP-03: reCAPTCHA DOM Detection</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 540px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; }
        h1 { font-size: 18px; color: #38bdf8; margin: 0 0 8px 0; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 10px; color: #f8fafc; font-size: 13px; margin-bottom: 14px; }
        .synthetic-widget { background: #090d16; border: 1px solid #475569; border-radius: 6px; padding: 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
        .synthetic-checkbox { width: 24px; height: 24px; border: 2px solid #94a3b8; border-radius: 4px; background: #1e293b; }
        button { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CAPTCHA Lab CAP-03: reCAPTCHA DOM Detection</h1>
        <p>Local synthetic .g-recaptcha element. Zero third-party scripts loaded.</p>
        <form id="form-cap-03">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" placeholder="Message" rows="2" required></textarea>

            <!-- Synthetic reCAPTCHA marker -->
            <div class="g-recaptcha" data-sitekey="6Ld_mock_test_sitekey_recaptcha_v2_alpha">
                <div class="synthetic-widget">
                    <div class="synthetic-checkbox" id="recaptcha-anchor"></div>
                    <span style="font-size: 13px; color: #e2e8f0;">I'm not a robot (Synthetic Local Marker)</span>
                </div>
                <textarea id="g-recaptcha-response" name="g-recaptcha-response" class="g-recaptcha-response" style="display:none;"></textarea>
            </div>

            <button type="button" id="submit-btn">Validate Presence</button>
        </form>
    </div>
</body>
</html>
