<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turnstile Protected Newsletter</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 8px; border: 1px solid #334155; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { background: #0284c7; color: #fff; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .success-box { display: none; background: rgba(74, 222, 128, 0.15); border: 1px solid #4ade80; color: #4ade80; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: 600; }
        .cf-turnstile { margin: 15px 0; min-height: 65px; border: 1px dashed #64748b; border-radius: 4px; padding: 8px; display: flex; align-items: center; justify-content: center; background: #111827; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Protected Newsletter Opt-In</h2>
        <p>Subscribe securely with Cloudflare Turnstile bot protection.</p>
        <form id="turnstile-newsletter-form" action="/contact-success.html" method="POST">
            <label for="email">Subscriber Email</label>
            <input type="email" id="email" name="subscriber_email" required placeholder="subscriber@example.com">
            
            <!-- Real DOM Turnstile Widget container -->
            <div id="cf-turnstile-widget" class="cf-turnstile" data-sitekey="0x4AAAAAAADn3g5-testkey">
                <span id="cf-turnstile-status" style="color: #94a3b8; font-size: 11px;">[Cloudflare Turnstile Widget Standby]</span>
                <input type="hidden" name="cf-turnstile-response" id="cf-turnstile-response" value="">
            </div>

            <button type="submit" id="submit-btn">Subscribe Securely</button>
            <div id="success-banner" class="success-box wpcf7-mail-sent-ok" role="status">
                Verified Subscription Complete!
            </div>
            <div id="siteverify-result" style="display:none;"></div>
        </form>
    </div>

    <script>
        // Test simulation helper: inject external token into DOM
        window.__simulateExternalTurnstileSolve = function(tokenVal) {
            var tok = tokenVal || ('turnstile_ext_' + Date.now());
            var input = document.getElementById('cf-turnstile-response');
            if (input) input.value = tok;
            var w = document.getElementById('cf-turnstile-widget');
            if (w) w.setAttribute('data-token', tok);
            var st = document.getElementById('cf-turnstile-status');
            if (st) {
                st.textContent = 'Solved by External Extension!';
                st.style.color = '#4ade80';
            }
            window.__siteverify_result = { verified: true, hostname: '127.0.0.1' };
            var sr = document.getElementById('siteverify-result');
            if (sr) sr.textContent = JSON.stringify(window.__siteverify_result);
            return tok;
        };

        window.__simulateExternalTurnstileError = function() {
            var w = document.getElementById('cf-turnstile-widget');
            if (w) {
                w.classList.add('cf-turnstile-error');
                w.setAttribute('data-state', 'error');
            }
            var st = document.getElementById('cf-turnstile-status');
            if (st) {
                st.textContent = 'Verification Failed';
                st.style.color = '#ef4444';
            }
        };

        document.getElementById('turnstile-newsletter-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var tok = document.getElementById('cf-turnstile-response').value;
            if (!tok) {
                alert('Turnstile verification required!');
                return;
            }
            var btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';
            fetch('/contact-success.html', { method: 'POST' }).then(function(res) {
                if (!res.ok) return;
                var rcpt = res.headers.get('X-XPIDER-Receipt-Id');
                if (rcpt) {
                    var el = document.getElementById('xpider-receipt-id');
                    if (!el) {
                        el = document.createElement('div');
                        el.id = 'xpider-receipt-id';
                        el.style.display = 'none';
                        document.body.appendChild(el);
                    }
                    el.setAttribute('data-receipt-id', rcpt);
                    el.textContent = rcpt;
                }
                setTimeout(function() {
                    btn.textContent = 'Subscribed!';
                    document.getElementById('success-banner').style.display = 'block';
                    window.dispatchEvent(new CustomEvent('form-submitted', { detail: { status: 'SUCCESS' } }));
                }, 300);
            });
        });
    </script>
</body>
</html>
