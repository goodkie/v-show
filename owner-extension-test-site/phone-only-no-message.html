<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Phone Callback Request (No Message Field)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; color: #38bdf8; margin-top: 0; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #94a3b8; }
        input[type="text"], input[type="email"], input[type="tel"] { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 10px 12px; color: #f8fafc; font-size: 14px; }
        button[type="submit"] { width: 100%; background: #0284c7; color: white; border: none; border-radius: 6px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        .badge { display: inline-block; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin-top: 20px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Request a Phone Callback</h1>
        <p>Please enter your contact details to request a phone call.</p>

        <!-- Form has Phone and Email, but strictly NO multiline message field -->
        <form id="phone-callback-form" action="/contact-success.html" method="POST">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required placeholder="555-0199">
            </div>
            <button type="submit" id="submit-btn">Request Call</button>
        </form>

        <div class="badge">
            ⚠️ Intent: Phone-Only Lead Form (NO message field -> Zero Submissions Required)
        </div>
    </div>
</body>
</html>
