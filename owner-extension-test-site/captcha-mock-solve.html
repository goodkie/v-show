<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CAPTCHA Lab CAP-06: Mock Provider Solve & Token Injection</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 540px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; }
        h1 { font-size: 18px; color: #38bdf8; margin: 0 0 8px 0; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 10px; color: #f8fafc; font-size: 13px; margin-bottom: 14px; }
        .synthetic-widget { background: #090d16; border: 1px solid #475569; border-radius: 6px; padding: 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
        .synthetic-checkbox { width: 24px; height: 24px; border: 2px solid #94a3b8; border-radius: 4px; background: #1e293b; }
        .synthetic-checkbox.checked { background: #22c55e; border-color: #4ade80; }
        button { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; width: 100%; cursor: pointer; }
        .success-box { display: none; background: rgba(74, 222, 128, 0.15); border: 1px solid #4ade80; color: #4ade80; padding: 12px; border-radius: 6px; margin-top: 14px; text-align: center; }
        .status-badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #334155; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <span class="status-badge" id="solve-state">STATUS: AWAITING_SOLVE</span>
        <h1>CAPTCHA Lab CAP-06: Mock Provider Solve</h1>
        <p>Gated local mock solve path. Receives mock token, dispatches verification, transitions to success.</p>
        <form id="form-cap-06" action="contact-success.html" method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" placeholder="Message" rows="2" required></textarea>

            <div class="g-recaptcha" data-sitekey="mock_key_cap06_success">
                <div class="synthetic-widget">
                    <div class="synthetic-checkbox" id="recaptcha-anchor"></div>
                    <span id="widget-label" style="font-size: 13px; color: #e2e8f0;">Security Challenge (Mock Provider Target)</span>
                </div>
                <textarea id="g-recaptcha-response" name="g-recaptcha-response" style="display:none;"></textarea>
            </div>

            <button type="submit" id="submit-btn">Send With Verified Token</button>
            <div id="success-banner" class="success-box wpcf7-mail-sent-ok gform_confirmation_message">Challenge verified and form submitted successfully!</div>
        </form>
    </div>

    <script>
        const respEl = document.getElementById('g-recaptcha-response');
        const stateEl = document.getElementById('solve-state');
        const anchorEl = document.getElementById('recaptcha-anchor');
        const succEl = document.getElementById('success-banner');

        // Watch for token injection
        function checkToken() {
            if (respEl && respEl.value && respEl.value.startsWith('mock_token_')) {
                stateEl.textContent = 'STATUS: TOKEN_INJECTED';
                stateEl.style.background = '#065f46';
                anchorEl.classList.add('checked');
                window.__xpider_mock_solved = true;
                return true;
            }
            return false;
        }

        respEl.addEventListener('input', checkToken);
        respEl.addEventListener('change', checkToken);

        // Listen for extension window postMessage
        window.addEventListener('message', function(ev) {
            if (ev.data && (ev.data.action === 'CAPTCHA_SOLVED' || ev.data.token)) {
                checkToken();
            }
        });

        document.getElementById('form-cap-06').addEventListener('submit', function(e) {
            e.preventDefault();
            if (checkToken()) {
                succEl.style.display = 'block';
                window.dispatchEvent(new CustomEvent('form-submitted', { detail: { status: 'SUCCESS' } }));
            } else {
                alert('CAPTCHA Token required before submission!');
            }
        });
    </script>
</body>
</html>
