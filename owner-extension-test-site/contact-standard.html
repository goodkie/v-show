<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Standard Inquiry Form</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; color: #38bdf8; margin-top: 0; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input[type="text"], input[type="email"], input[type="tel"], textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 10px 12px; color: #f8fafc; font-size: 14px; outline: none; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button[type="submit"] { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; }
        button[type="submit"]:hover { background: #0369a1; }
        .success-box { display: none; background: rgba(74, 222, 128, 0.15); border: 1px solid #4ade80; color: #4ade80; padding: 14px 18px; border-radius: 8px; margin-top: 20px; font-weight: 600; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Contact Support & Sales</h1>
        <p>Please complete the form below. Our team typically replies within 24 business hours.</p>

        <form id="standard-contact-form" action="contact-success.html" method="GET">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Work Email *</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="+1 (555) 019-2834">
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="Inquiry regarding enterprise pricing">
            </div>

            <div class="form-group">
                <label for="message">Your Message *</label>
                <textarea id="message" name="message" rows="5" required placeholder="Tell us how we can assist you..."></textarea>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">Send Message</button>

            <div id="success-banner" class="success-box wpcf7-mail-sent-ok gform_confirmation_message" role="status" aria-live="polite">
                Thank you! Your message has been sent successfully.
            </div>
        </form>
    </div>
    <footer style="margin-top: 30px; text-align: center; font-size: 12px; color: #64748b;">
        Direct: <a href="mailto:contact@autonomous-audit.io" style="color: #94a3b8;">contact@autonomous-audit.io</a> | Support: <a href="mailto:billing@autonomous-audit.io" style="color: #94a3b8;">billing@autonomous-audit.io</a>
    </footer>

    <script>
        document.getElementById('standard-contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').textContent = 'Submitting...';
            var postUrl = '/contact-success.html' + (window.location.search || '');
            fetch(postUrl, { method: 'POST' }).then(function(res) {
                if (!res.ok) {
                    document.getElementById('submit-btn').textContent = 'Server Error (500)';
                    return;
                }
                var rcpt = res.headers.get('X-XPIDER-Receipt-Id');
                if (rcpt) {
                    var el = document.getElementById('xpider-receipt-id');
                    if (!el) {
                        el = document.createElement('div');
                        el.id = 'xpider-receipt-id';
                        el.style.display = 'none';
                        document.body.appendChild(el);
                    }
                    el.setAttribute('data-receipt-id', rcpt);
                    el.textContent = rcpt;
                }
                setTimeout(function() {
                    document.getElementById('submit-btn').textContent = 'Sent!';
                    document.getElementById('success-banner').style.display = 'block';
                    window.dispatchEvent(new CustomEvent('form-submitted', { detail: { status: 'SUCCESS' } }));
                }, 300);
            }).catch(function() {
                document.getElementById('submit-btn').textContent = 'Network Failed';
            });
        });
    </script>
</body>
</html>
