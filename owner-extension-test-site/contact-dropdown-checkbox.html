<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Department Inquiry & Agreements</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; color: #38bdf8; margin-top: 0; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input[type="text"], input[type="email"], select, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 10px 12px; color: #f8fafc; font-size: 14px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; cursor: pointer; }
        .checkbox-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: #0284c7; cursor: pointer; }
        .checkbox-row span { font-size: 13px; color: #cbd5e1; }
        button[type="submit"] { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 10px; }
        button[type="submit"]:hover { background: #0369a1; }
        .success-box { display: none; background: rgba(74, 222, 128, 0.15); border: 1px solid #4ade80; color: #4ade80; padding: 14px 18px; border-radius: 8px; margin-top: 20px; font-weight: 600; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Department Inquiry Form</h1>
        <p>Please select your department and accept our terms to submit your request.</p>

        <form id="dropdown-checkbox-form" action="contact-success.html" method="GET">
            <div class="form-group">
                <label for="name">Full Name *</label>
                <input type="text" id="name" name="name" required placeholder="Jane Smith">
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email" required placeholder="jane@example.com">
            </div>

            <div class="form-group">
                <label for="department">Select Department *</label>
                <select id="department" name="department" required>
                    <option value="">-- Please Select --</option>
                    <option value="support">Customer & Technical Support</option>
                    <option value="sales">Sales & Business Development</option>
                    <option value="billing">Accounting & Billing</option>
                </select>
            </div>

            <div class="form-group">
                <label for="message">Inquiry Details *</label>
                <textarea id="message" name="message" rows="5" required placeholder="Explain your inquiry in detail..."></textarea>
            </div>

            <label class="checkbox-row">
                <input type="checkbox" id="newsletter_opt" name="newsletter_opt" value="1">
                <span>Sign up for monthly technical newsletters (Optional)</span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="agree_terms" name="agree_terms" value="1" required>
                <span>I agree to the Terms of Service and Privacy Policy *</span>
            </label>

            <button type="submit" id="submit-btn" class="submit-btn">Submit Department Request</button>

            <div id="success-banner" class="success-box wpcf7-mail-sent-ok gform_confirmation_message" role="status" aria-live="polite">
                Thank you! Your message has been sent successfully.
            </div>
        </form>
    </div>

    <script>
        document.getElementById('dropdown-checkbox-form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').textContent = 'Submitting...';
            setTimeout(function() {
                document.getElementById('submit-btn').textContent = 'Sent!';
                document.getElementById('success-banner').style.display = 'block';
                window.dispatchEvent(new CustomEvent('form-submitted', { detail: { status: 'SUCCESS' } }));
            }, 300);
        });
    </script>
</body>
</html>
