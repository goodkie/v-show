<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CAPTCHA Lab CAP-05: Cloudflare Turnstile DOM Detection</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 540px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; }
        h1 { font-size: 18px; color: #38bdf8; margin: 0 0 8px 0; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 10px; color: #f8fafc; font-size: 13px; margin-bottom: 14px; }
        .synthetic-widget { background: #090d16; border: 1px solid #475569; border-radius: 6px; padding: 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
        .synthetic-checkbox { width: 24px; height: 24px; border: 2px solid #94a3b8; border-radius: 4px; background: #1e293b; }
        button { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; width: 100%; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>CAPTCHA Lab CAP-05: Turnstile DOM Detection</h1>
        <p>Local synthetic .cf-turnstile element. Zero third-party scripts loaded.</p>
        <form id="form-cap-05">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" placeholder="Message" rows="2" required></textarea>

            <!-- Synthetic Cloudflare Turnstile marker -->
            <div class="cf-turnstile" data-sitekey="0x4AAAAAA_mock_turnstile_sitekey_gamma">
                <div class="synthetic-widget">
                    <div class="synthetic-checkbox" id="turnstile-anchor"></div>
                    <span style="font-size: 13px; color: #e2e8f0;">Cloudflare Turnstile (Synthetic Local Marker)</span>
                </div>
                <input type="hidden" name="cf-turnstile-response" id="cf-turnstile-response">
            </div>

            <button type="submit" id="submit-btn">Send With Verified Token</button>
            <div id="success-banner" class="success-box wpcf7-mail-sent-ok gform_confirmation_message" style="display:none;background:rgba(74,222,128,.15);border:1px solid #4ade80;color:#4ade80;padding:12px;border-radius:6px;margin-top:14px;text-align:center;">Challenge verified and form submitted successfully!</div>
        </form>
    </div>
    <script>
    /* Synthetic lab widget: flags resolved state when a mock token lands in its response field (no third-party code). */
    (function () {
        function mark() {
            var f = document.querySelector('[name="g-recaptcha-response"],[name="h-captcha-response"],[name="cf-turnstile-response"]');
            var w = document.querySelector('.g-recaptcha,.h-captcha,.cf-turnstile');
            if (f && w && f.value && f.value.indexOf('mock_token_') === 0) { w.setAttribute('data-challenge-state', 'resolved'); window.__captcha_challenge_resolved = true; }
        }
        ['input','change'].forEach(function (e) { document.addEventListener(e, mark, true); });
        window.addEventListener('message', function () { setTimeout(mark, 0); });
        setInterval(mark, 200);
        var frm = document.querySelector('form');
        if (frm) frm.addEventListener('submit', function (e) {
            e.preventDefault(); mark();
            if (window.__captcha_challenge_resolved === true) {
                document.getElementById('success-banner').style.display = 'block';
                window.dispatchEvent(new CustomEvent('form-submitted', { detail: { status: 'SUCCESS' } }));
            } else {
                console.warn('[FIXTURE_REJECT] CAPTCHA Token required before submission!');
                var eb = document.getElementById('error-banner');
                if (!eb) {
                    eb = document.createElement('div');
                    eb.id = 'error-banner';
                    eb.style.cssText = 'color:#ef4444;background:#450a0a;border:1px solid #b91c1c;padding:8px;border-radius:4px;margin-top:10px;font-size:12px;font-weight:bold;';
                    frm.appendChild(eb);
                }
                eb.textContent = 'CAPTCHA Token required before submission!';
            }
        });
    })();
    </script>
</body>
</html>
