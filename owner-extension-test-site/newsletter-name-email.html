<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Name and Email Newsletter</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 8px; border: 1px solid #334155; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .success-box { display: none; background: rgba(74, 222, 128, 0.15); border: 1px solid #4ade80; color: #4ade80; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: 600; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Weekly Tech Dispatch</h2>
        <p>Curated engineering insights delivered to your inbox every Friday.</p>
        <form id="newsletter-form" action="/contact-success.html" method="POST">
            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required placeholder="Alice Developer">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" required placeholder="alice@example.com">
            <button type="submit" id="submit-btn">Join Newsletter</button>
            <div id="success-banner" class="success-box wpcf7-mail-sent-ok" role="status">
                Subscription Confirmed! Thank you for joining.
            </div>
        </form>
    </div>
    <script>
        document.getElementById('newsletter-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Joining...';
            fetch('/contact-success.html', { method: 'POST' }).then(function(res) {
                if (!res.ok) return;
                var rcpt = res.headers.get('X-XPIDER-Receipt-Id');
                if (rcpt) {
                    var el = document.getElementById('xpider-receipt-id');
                    if (!el) {
                        el = document.createElement('div');
                        el.id = 'xpider-receipt-id';
                        el.style.display = 'none';
                        document.body.appendChild(el);
                    }
                    el.setAttribute('data-receipt-id', rcpt);
                    el.textContent = rcpt;
                }
                setTimeout(function() {
                    btn.textContent = 'Joined!';
                    document.getElementById('success-banner').style.display = 'block';
                    window.dispatchEvent(new CustomEvent('form-submitted', { detail: { status: 'SUCCESS' } }));
                }, 300);
            });
        });
    </script>
</body>
</html>
