<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic SPA Newsletter</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 8px; border: 1px solid #334155; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { background: #0284c7; color: #fff; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        .success-box { display: none; background: rgba(74, 222, 128, 0.15); border: 1px solid #4ade80; color: #4ade80; padding: 12px; border-radius: 6px; margin-top: 15px; text-align: center; font-weight: 600; }
        .loading { color: #94a3b8; font-style: italic; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Single Page App Newsletter Component</h2>
        <div id="spa-root">
            <p class="loading">Loading newsletter interactive widget...</p>
        </div>
    </div>
    <script>
        // Simulate dynamic SPA mounting after 400ms
        setTimeout(function() {
            var root = document.getElementById('spa-root');
            root.innerHTML = '<form id="spa-newsletter-form" action="/contact-success.html" method="POST">' +
                '<label for="spa-email">Email Address</label>' +
                '<input type="email" id="spa-email" name="email" required placeholder="spa-user@example.com">' +
                '<button type="submit" id="spa-submit-btn">Subscribe via React SPA</button>' +
                '<div id="spa-success-banner" class="success-box wpcf7-mail-sent-ok" role="status">SPA Subscription Complete!</div>' +
                '</form>';

            document.getElementById('spa-newsletter-form').addEventListener('submit', function(e) {
                e.preventDefault();
                var btn = document.getElementById('spa-submit-btn');
                btn.disabled = true;
                btn.textContent = 'Submitting SPA...';
                fetch('/contact-success.html', { method: 'POST' }).then(function(res) {
                    if (!res.ok) return;
                    var rcpt = res.headers.get('X-XPIDER-Receipt-Id');
                    if (rcpt) {
                        var el = document.getElementById('xpider-receipt-id');
                        if (!el) {
                            el = document.createElement('div');
                            el.id = 'xpider-receipt-id';
                            el.style.display = 'none';
                            document.body.appendChild(el);
                        }
                        el.setAttribute('data-receipt-id', rcpt);
                        el.textContent = rcpt;
                    }
                    setTimeout(function() {
                        btn.textContent = 'Subscribed!';
                        document.getElementById('spa-success-banner').style.display = 'block';
                        window.dispatchEvent(new CustomEvent('form-submitted', { detail: { status: 'SUCCESS' } }));
                    }, 300);
                });
            });
        }, 400);
    </script>
</body>
</html>
