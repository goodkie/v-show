<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Field Mapping Collision Regression Fixture</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 680px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 20px; color: #38bdf8; margin-top: 0; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input[type="text"], input[type="email"], input[type="tel"], textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 10px 12px; color: #f8fafc; font-size: 13px; outline: none; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button[type="submit"] { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
        .success-box { display: none; background: rgba(74, 222, 128, 0.15); border: 1px solid #4ade80; color: #4ade80; padding: 12px 16px; border-radius: 8px; margin-top: 16px; font-weight: 600; text-align: center; }
        .error-box { display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; padding: 12px 16px; border-radius: 8px; margin-top: 16px; font-weight: 600; text-align: center; }
        .audit-results { margin-top: 20px; padding: 14px; background: #090d16; border-radius: 8px; border: 1px solid #1e293b; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Field Mapping Collision Regression Fixture</h1>
        <p>Exercises all 8 collision cases specified in Issue #6 R6.9G.10.3.7.1.4.5 Section C.</p>

        <form id="collision-test-form" action="contact-success.html" method="POST">
            <!-- Baseline email -->
            <div class="form-group">
                <label for="f-email">Work Email *</label>
                <input type="email" id="f-email" name="email" required placeholder="audit@autonomous.local">
            </div>

            <!-- 7. input type=text label="Contact Person" -> expected NAME, NOT PHONE -->
            <div class="form-group">
                <label for="f-contact-person">Contact Person *</label>
                <input type="text" id="f-contact-person" name="contact_person" required placeholder="Contact Representative Name">
            </div>

            <!-- 5. input type=tel label="Contact Number" -> expected PHONE -->
            <div class="form-group">
                <label for="f-contact-number">Contact Number *</label>
                <input type="tel" id="f-contact-number" name="contact_number" required placeholder="+1 (555) 019-2834">
            </div>

            <!-- 6. input type=text label="Telephone" -> expected PHONE -->
            <div class="form-group">
                <label for="f-telephone">Telephone *</label>
                <input type="text" id="f-telephone" name="telephone" required placeholder="Direct Telephone line">
            </div>

            <!-- 8. input type=text label="Subject / Topic" -> expected SUBJECT -->
            <div class="form-group">
                <label for="f-subject-topic">Subject / Topic *</label>
                <input type="text" id="f-subject-topic" name="subject_topic" required placeholder="Subject / Topic of inquiry">
            </div>

            <!-- 1. textarea placeholder="Tell us how we can assist you..." -> expected MESSAGE -->
            <div class="form-group">
                <label for="f-msg-tell-us">Assistance Details *</label>
                <textarea id="f-msg-tell-us" name="msg_tell_us" rows="3" required placeholder="Tell us how we can assist you..."></textarea>
            </div>

            <!-- 2. textarea label="Contact Message" -> expected MESSAGE -->
            <div class="form-group">
                <label for="f-msg-contact-label">Contact Message *</label>
                <textarea id="f-msg-contact-label" name="msg_contact_label" rows="3" required placeholder="Please enter your inquiry..."></textarea>
            </div>

            <!-- 3. textarea placeholder="Telephone inquiry details" -> expected MESSAGE -->
            <div class="form-group">
                <label for="f-msg-tel-details">Inquiry Breakdown *</label>
                <textarea id="f-msg-tel-details" name="msg_tel_details" rows="3" required placeholder="Telephone inquiry details"></textarea>
            </div>

            <!-- 4. textarea placeholder="How should we contact you about this request?" -> expected MESSAGE -->
            <div class="form-group">
                <label for="f-msg-contact-how">Preferred Contact Method / Notes *</label>
                <textarea id="f-msg-contact-how" name="msg_contact_how" rows="3" required placeholder="How should we contact you about this request?"></textarea>
            </div>

            <button type="submit" id="submit-btn">Validate & Submit Collision Form</button>

            <div id="success-banner" class="success-box wpcf7-mail-sent-ok gform_confirmation_message" role="status">
                All 8 collision test fields correctly classified and verified! Form submitted successfully.
            </div>
            <div id="error-banner" class="error-box" role="alert"></div>
        </form>

        <div id="audit-log" class="audit-results" style="display: none;"></div>
    </div>

    <script>
        document.getElementById('collision-test-form').addEventListener('submit', function(e) {
            e.preventDefault();

            // Self-Auditing verification of fields before reporting SUCCESS
            const contactPersonVal = document.getElementById('f-contact-person').value.trim();
            const contactNumberVal = document.getElementById('f-contact-number').value.trim();
            const telephoneVal = document.getElementById('f-telephone').value.trim();
            const subjectTopicVal = document.getElementById('f-subject-topic').value.trim();
            const msgTellUsVal = document.getElementById('f-msg-tell-us').value.trim();
            const msgContactLabelVal = document.getElementById('f-msg-contact-label').value.trim();
            const msgTelDetailsVal = document.getElementById('f-msg-tel-details').value.trim();
            const msgContactHowVal = document.getElementById('f-msg-contact-how').value.trim();

            const errors = [];

            // Invariants:
            // 1. Textareas must NOT contain phone numbers
            const isPhoneVal = (v) => /^\+?[\d\s\-\(\)\.]{7,25}$/.test(v) && !/[a-zA-Z]{3,}/.test(v);
            if (isPhoneVal(msgTellUsVal)) errors.push('Tell Us textarea was populated with phone number!');
            if (isPhoneVal(msgContactLabelVal)) errors.push('Contact Message textarea was populated with phone number!');
            if (isPhoneVal(msgTelDetailsVal)) errors.push('Telephone details textarea was populated with phone number!');
            if (isPhoneVal(msgContactHowVal)) errors.push('Contact How textarea was populated with phone number!');

            // 2. Contact Person must NOT contain phone number
            if (isPhoneVal(contactPersonVal)) errors.push('Contact Person input was populated with phone number!');

            const errBanner = document.getElementById('error-banner');
            const succBanner = document.getElementById('success-banner');
            const auditLog = document.getElementById('audit-log');

            if (errors.length > 0) {
                errBanner.textContent = 'COLLISION MISROUTE: ' + errors.join('; ');
                errBanner.style.display = 'block';
                succBanner.style.display = 'none';
                window.__xpider_collision_status = { pass: false, errors };
                return;
            }

            succBanner.style.display = 'block';
            errBanner.style.display = 'none';
            auditLog.style.display = 'block';
            auditLog.innerHTML = `
                <div><strong>[COLLISION VERIFICATION PASS]</strong></div>
                <div>1. msg_tell_us: len=${msgTellUsVal.length} (MESSAGE)</div>
                <div>2. msg_contact_label: len=${msgContactLabelVal.length} (MESSAGE)</div>
                <div>3. msg_tel_details: len=${msgTelDetailsVal.length} (MESSAGE)</div>
                <div>4. msg_contact_how: len=${msgContactHowVal.length} (MESSAGE)</div>
                <div>5. contact_number: len=${contactNumberVal.length} (PHONE)</div>
                <div>6. telephone: len=${telephoneVal.length} (PHONE)</div>
                <div>7. contact_person: len=${contactPersonVal.length} (NAME)</div>
                <div>8. subject_topic: len=${subjectTopicVal.length} (SUBJECT)</div>
            `;
            window.__xpider_collision_status = { pass: true, errors: [] };
            window.dispatchEvent(new CustomEvent('form-submitted', { detail: { status: 'SUCCESS' } }));
        });
    </script>
</body>
</html>
