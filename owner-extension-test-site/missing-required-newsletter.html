<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subscribe to Newsletter — Missing Required Input</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 8px; border: 1px solid #334155; }
        input { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; }
        button { background: #0284c7; color: #fff; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Subscribe to Our Newsletter</h2>
        <!-- Form with explicit opt-in intent, but with an unfillable required custom token -->
        <form id="missing-form" action="/contact-success.html" method="POST">
            <label for="subscriber-email">Email Address:</label>
            <input type="email" id="subscriber-email" name="subscriber_email" required>

            <label for="custom_token">Required Internal Department Code (Unknown):</label>
            <input type="text" id="custom_token" name="custom_dept_code_xyz" required pattern="[A-Z]{10}-[0-9]{5}" placeholder="ABCDEFGHIJ-12345">

            <button type="submit" id="submit-btn">Subscribe</button>
        </form>
    </div>
    <script>
        document.getElementById('missing-form').addEventListener('submit', function(e) {
            e.preventDefault();
            // Should NEVER be reached!
            fetch('/contact-success.html', { method: 'POST' });
        });
    </script>
</body>
</html>
