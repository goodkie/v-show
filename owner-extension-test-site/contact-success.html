<!DOCTYPE html>
<html lang="en">
<head>

    </style>
</head>

    <div class="card">
        <div class="icon">✅</div>
        <h1>Submission Received</h1>

            Thank you! Your message has been sent successfully. We will get back to you shortly.
        </div>
        <p style="color: #94a3b8; font-size: 13px; margin-top: 20px;">
