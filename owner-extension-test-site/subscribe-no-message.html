<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Newsletter Subscription - Non-Inquiry Form</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; color: #38bdf8; margin-top: 0; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .subscribe-form { display: flex; gap: 8px; justify-content: center; }
        input[type="email"] { flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 12px 14px; color: #f8fafc; font-size: 14px; outline: none; }
        input[type="email"]:focus { border-color: #38bdf8; }
        button[type="submit"] { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .badge { display: inline-block; background: rgba(234, 179, 8, 0.15); border: 1px solid #eab308; color: #facc15; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin-top: 24px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Subscribe to Product Updates</h1>
        <p>Get weekly engineering release notes and product announcements directly to your inbox.</p>

        <!-- Pure email capture form without long-text inquiry field -->
        <form id="subscribe-form" class="subscribe-form" action="#" method="POST">
            <input type="email" id="email" name="subscriber_email" required placeholder="Enter your email address">
            <button type="submit" id="subscribe-btn">Subscribe</button>
        </form>

        <div class="badge">
            ℹ️ Intent Classification: Negative Non-Inquiry Form (Expected: SKIPPED)
        </div>
    </div>
</body>
</html>
