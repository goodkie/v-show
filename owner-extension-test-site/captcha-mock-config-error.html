<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CAPTCHA Lab CAP-08: Mock Permanent Config Error</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 540px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 28px; }
        h1 { font-size: 18px; color: #38bdf8; margin: 0 0 8px 0; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; }
        input, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 10px; color: #f8fafc; font-size: 13px; margin-bottom: 14px; }
        .synthetic-widget { background: #090d16; border: 1px solid #475569; border-radius: 6px; padding: 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 12px; }
        .synthetic-checkbox { width: 24px; height: 24px; border: 2px solid #94a3b8; border-radius: 4px; background: #1e293b; }
        button { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; width: 100%; cursor: pointer; }
        .status-badge { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #991b1b; margin-bottom: 10px; color: #fecaca; }
    </style>
</head>
<body>
    <div class="container">
        <span class="status-badge" id="solve-state">MOCK SCENARIO: ERROR_ZERO_BALANCE</span>
        <h1>CAPTCHA Lab CAP-08: Mock Permanent Config Error</h1>
        <p>Mock solver simulates ERROR_ZERO_BALANCE. Proves epoch-blocked suppression and duplicate rejection.</p>
        <form id="form-cap-08">
            <input type="text" name="name" placeholder="Name" required>
            <input type="email" name="email" placeholder="Email" required>
            <textarea name="message" placeholder="Message" rows="2" required></textarea>

            <div class="g-recaptcha" data-sitekey="mock_key_cap08_zero_balance">
                <div class="synthetic-widget">
                    <div class="synthetic-checkbox"></div>
                    <span style="font-size: 13px; color: #e2e8f0;">Security Challenge (Simulated Zero Balance)</span>
                </div>
                <textarea id="g-recaptcha-response" name="g-recaptcha-response" style="display:none;"></textarea>
            </div>

            <button type="button" id="submit-btn" disabled>Waiting For Solver</button>
        </form>
    </div>
</body>
</html>
