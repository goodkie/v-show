<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Inquiry — AI Required Fields & Constraint Completion Fixture</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0f19; color: #e2e8f0; padding: 24px; }
        .card { max-width: 600px; margin: 0 auto; background: #161e2e; border: 1px solid #3b82f6; border-radius: 8px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #60a5fa; font-size: 20px; }
        .form-group { margin-bottom: 14px; }
        label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 4px; font-weight: 500; }
        input[type="text"], input[type="email"], input[type="number"], input[type="url"], input[type="date"], select, textarea {
            width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #334155; color: #f8fafc; padding: 8px 10px; border-radius: 4px; font-size: 13px;
        }
        input:focus, select:focus, textarea:focus { border-color: #3b82f6; outline: none; }
        textarea { height: 60px; resize: vertical; }
        .radio-group, .checkbox-group { display: flex; align-items: center; gap: 16px; margin-top: 4px; }
        .radio-label, .checkbox-label { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #cbd5e1; cursor: pointer; }
        input[type="radio"], input[type="checkbox"] { width: 16px; height: 16px; accent-color: #3b82f6; cursor: pointer; }
        button { background: #2563eb; color: #fff; font-weight: bold; border: none; padding: 12px 18px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; }
        button:hover { background: #1d4ed8; }
        #receipt-banner { display: none; margin-top: 16px; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12px; color: #34d399; }
    </style>
</head>
<body>
    <div class="card">
        <h2>AI Form Completion — Required Constraints Fixture</h2>
        <p style="font-size: 13px; color: #94a3b8; margin-bottom: 18px;">
            Standard template fields (name, email, message) are augmented with unmapped required text, number, date, URL, select, radio, and consent constraints.
        </p>

        <form id="ai-required-form" method="POST" action="/contact-success.html">
            <!-- 1. Standard Template Fields -->
            <div class="form-group">
                <label for="f-name">Your Full Name *</label>
                <input type="text" id="f-name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="f-email">Business Email *</label>
                <input type="email" id="f-email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="f-message">Inquiry Details *</label>
                <textarea id="f-message" name="message" required placeholder="Please describe your project or request..."></textarea>
            </div>

            <!-- 2. Unmapped Required Text Fields (Filled by AI) -->
            <div class="form-group">
                <label for="f-company">Company / Organization *</label>
                <input type="text" id="f-company" name="company" required maxlength="40" placeholder="Organization name">
            </div>
            <div class="form-group">
                <label for="f-department">Department *</label>
                <input type="text" id="f-department" name="department" required placeholder="e.g. Operations, IT, Engineering">
            </div>

            <!-- 3. Unmapped Number Fields with Min / Max / Step Constraints -->
            <div class="form-group">
                <label for="f-budget">Estimated Budget (USD: $100 - $5000, Step $50) *</label>
                <input type="number" id="f-budget" name="budget" required min="100" max="5000" step="50" placeholder="500">
            </div>
            <div class="form-group">
                <label for="f-team-size">Team Size (1 - 20) *</label>
                <input type="number" id="f-team-size" name="team_size" required min="1" max="20" placeholder="5">
            </div>

            <!-- 4. Unmapped Specialized Input Types -->
            <div class="form-group">
                <label for="f-website">Project Website URL *</label>
                <input type="url" id="f-website" name="website" required placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label for="f-date">Preferred Consultation Date *</label>
                <input type="date" id="f-date" name="preferred_date" required min="2026-01-01" max="2027-12-31">
            </div>

            <!-- 5. Dropdown / Select with Placeholder -->
            <div class="form-group">
                <label for="f-service">Service Category *</label>
                <select id="f-service" name="service_category" required>
                    <option value="" disabled selected>-- Please Select Category --</option>
                    <option value="consulting">Technical Consulting</option>
                    <option value="integration">System Integration</option>
                    <option value="support">Enterprise Support</option>
                </select>
            </div>

            <!-- 6. Required Radio Choice -->
            <div class="form-group">
                <label>Project Priority *</label>
                <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="priority" value="standard" required> Standard</label>
                    <label class="radio-label"><input type="radio" name="priority" value="urgent"> Urgent</label>
                </div>
            </div>

            <!-- 7. Checkboxes: Required Consent vs Optional Marketing -->
            <div class="form-group">
                <div class="checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="f-terms" name="terms_consent" required>
                        I agree to the Terms of Service & Privacy Policy *
                    </label>
                </div>
                <div class="checkbox-group" style="margin-top: 8px;">
                    <label class="checkbox-label" style="color: #94a3b8;">
                        <input type="checkbox" id="f-marketing" name="marketing_opt_in">
                        Subscribe to periodic product newsletter (Optional)
                    </label>
                </div>
            </div>

            <button type="submit" id="submit-btn">Submit Complete Inquiry</button>
        </form>

        <div id="success-banner" class="success-box wpcf7-mail-sent-ok gform_confirmation_message" style="display:none; margin-top: 16px; background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; border-radius: 6px; padding: 12px; font-family: monospace; font-size: 12px; color: #34d399;" role="status" aria-live="polite">
            Thank you! Your message has been sent successfully.
            <div id="receipt-id" style="margin-top: 4px;"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('ai-required-form');
        form.addEventListener('submit', function (e) {
            e.preventDefault();

            // Native validity double check
            if (!form.checkValidity()) {
                console.warn('[VALIDITY_ERROR] Form has invalid fields!');
                const rb = document.getElementById('success-banner');
                rb.style.display = 'block';
                rb.style.borderColor = '#ef4444';
                rb.style.color = '#f87171';
                rb.textContent = '❌ Form has invalid fields according to native checkValidity()!';
                return;
            }

            var btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Submitting...';

            var postUrl = '/contact-success.html' + (window.location.search || '');
            fetch(postUrl, { method: 'POST' }).then(function(res) {
                var rcpt = res.headers.get('X-XPIDER-Receipt-Id') || ('rcpt_' + Date.now() + '_ai_complete');
                var el = document.getElementById('xpider-receipt-id');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'xpider-receipt-id';
                    el.style.display = 'none';
                    document.body.appendChild(el);
                }
                el.setAttribute('data-receipt-id', rcpt);
                el.textContent = rcpt;

                setTimeout(function() {
                    btn.textContent = 'Sent!';
                    var banner = document.getElementById('success-banner');
                    banner.style.display = 'block';
                    document.getElementById('receipt-id').textContent = 'Receipt: ' + rcpt;
                    window.dispatchEvent(new CustomEvent('form-submitted', { detail: { receiptId: rcpt, status: 'SUCCESS' } }));
                }, 300);
            }).catch(function() {
                btn.textContent = 'Network Failed';
            });
        });
    </script>
</body>
</html>
