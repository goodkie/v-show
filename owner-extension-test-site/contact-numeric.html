<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Enterprise Quote - Numeric Seats & Message</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 32px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        h1 { font-size: 22px; color: #38bdf8; margin-top: 0; margin-bottom: 8px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 6px; }
        input[type="text"], input[type="email"], input[type="number"], textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 10px 12px; color: #f8fafc; font-size: 14px; outline: none; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button[type="submit"] { background: #0284c7; color: white; border: none; border-radius: 6px; padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 10px; }
        button[type="submit"]:hover { background: #0369a1; }
        .success-box { display: none; background: rgba(74, 222, 128, 0.15); border: 1px solid #4ade80; color: #4ade80; padding: 14px 18px; border-radius: 8px; margin-top: 20px; font-weight: 600; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Enterprise Custom Quote</h1>
        <p>Request pricing tailored to your organization's required seat capacity.</p>

        <form id="numeric-contact-form" action="contact-success.html" method="GET">
            <div class="form-group">
                <label for="name">Contact Person *</label>
                <input type="text" id="name" name="name" required placeholder="Alex Johnson">
            </div>

            <div class="form-group">
                <label for="email">Corporate Email *</label>
                <input type="email" id="email" name="email" required placeholder="alex@company.com">
            </div>

            <div class="form-group">
                <label for="seats">Estimated User Seats (Numeric) *</label>
                <input type="number" id="seats" name="seats" min="1" max="5000" required placeholder="25">
            </div>

            <div class="form-group">
                <label for="message">Project Requirements & Scope *</label>
                <textarea id="message" name="message" rows="5" required placeholder="Describe your deployment timeline and feature requirements..."></textarea>
            </div>

            <button type="submit" id="submit-btn" class="submit-btn">Request Enterprise Quote</button>

            <div id="success-banner" class="success-box wpcf7-mail-sent-ok gform_confirmation_message" role="status" aria-live="polite">
                Thank you! Your message has been sent successfully.
            </div>
        </form>
    </div>

    <script>
        document.getElementById('numeric-contact-form').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('submit-btn').disabled = true;
            document.getElementById('submit-btn').textContent = 'Submitting...';
            // Authoritative server notification for fixture accounting (RC3.19 Test B)
            fetch('/contact-success.html', { method: 'POST' }).then(function(res) {
                var rcpt = res.headers.get('X-XPIDER-Receipt-Id');
                if (rcpt) {
                    var el = document.getElementById('xpider-receipt-id');
                    if (!el) {
                        el = document.createElement('div');
                        el.id = 'xpider-receipt-id';
                        el.style.display = 'none';
                        document.body.appendChild(el);
                    }
                    el.setAttribute('data-receipt-id', rcpt);
                    el.textContent = rcpt;
                }
            }).catch(function() {
                fetch('/contact-success.html').catch(function() {});
            });
            setTimeout(function() {
                document.getElementById('submit-btn').textContent = 'Sent!';
                document.getElementById('success-banner').style.display = 'block';
                window.dispatchEvent(new CustomEvent('form-submitted', { detail: { status: 'SUCCESS' } }));
            }, 300);
        });
    </script>
</body>
</html>
