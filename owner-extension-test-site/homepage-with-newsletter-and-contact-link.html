<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homepage with Newsletter & Contact Link</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 40px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 20px; }
        a.contact-link { color: #38bdf8; font-weight: bold; text-decoration: none; padding: 8px 16px; border: 1px solid #38bdf8; border-radius: 4px; }
        .newsletter-box { background: #1e293b; padding: 24px; border-radius: 8px; margin-top: 40px; max-width: 400px; }
        input { width: 100%; padding: 8px; margin: 8px 0; border-radius: 4px; border: 1px solid #475569; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <h2>Global Acme Homepage</h2>
        <nav>
            <a href="contact-standard.html" class="contact-link">Contact Us</a>
        </nav>
    </header>

    <div class="newsletter-box">
        <h3>Subscribe to Our Newsletter</h3>
        <p>Get daily updates on business innovations.</p>
        <form id="newsletter-form" action="/subscribe" method="POST">
            <input type="text" name="name" placeholder="Your Name">
            <input type="email" name="email" placeholder="Your Email">
            <input type="tel" name="phone" placeholder="Phone Number">
            <button type="submit">Subscribe</button>
        </form>
    </div>
</body>
</html>
