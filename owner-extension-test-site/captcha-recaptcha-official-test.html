<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Google reCAPTCHA v2 Official Test Key Fixture</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 30px; margin: 0; }
        .container { max-width: 520px; margin: 0 auto; background: #1e293b; border: 1px solid #3b82f6; border-radius: 12px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        h1 { font-size: 18px; color: #60a5fa; margin: 0 0 8px 0; }
        p { color: #94a3b8; font-size: 12px; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        input, textarea { width: 100%; box-sizing: border-box; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 8px 10px; color: #f8fafc; font-size: 13px; }
        .recaptcha-wrapper { margin: 16px 0; min-height: 78px; }
        button { background: #2563eb; color: white; border: none; border-radius: 6px; padding: 10px; font-weight: 600; width: 100%; cursor: pointer; }
        #success-banner { display: none; background: rgba(34, 197, 94, 0.15); border: 1px solid #22c55e; color: #4ade80; padding: 12px; border-radius: 6px; margin-top: 14px; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Google reCAPTCHA v2 Official Test Key Fixture</h1>
        <p>Official Google Test Sitekey: <code>6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI</code> (Always returns test token)</p>
        <form id="official-recaptcha-form" action="/contact-success.html" method="POST">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Business Email</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="555-0199">
            </div>
            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" placeholder="General Inquiry">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="3" required placeholder="This is an authorized verification test message."></textarea>
            </div>

            <!-- Official Google reCAPTCHA v2 Test Key -->
            <div class="recaptcha-wrapper">
                <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
            </div>

            <button type="submit" id="submit-btn">Send Message</button>
            <div id="success-banner" class="success-box">Challenge verified and message received!</div>
        </form>
    </div>
    <script>
        document.getElementById('official-recaptcha-form').addEventListener('submit', function(e) {
            var token = '';
            try {
                if (window.grecaptcha && typeof window.grecaptcha.getResponse === 'function') {
                    token = window.grecaptcha.getResponse();
                }
            } catch (_) {}
            if (!token) {
                var el = document.querySelector('[name="g-recaptcha-response"]');
                if (el && el.value) token = el.value;
            }
            if (token) {
                document.getElementById('success-banner').style.display = 'block';
            }
        });
    </script>
</body>
</html>
