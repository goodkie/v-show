<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DN'a ROBOTIC | Matterport 3D Digital Twin Virtual Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Three.js & OrbitControls -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

<style>
:root {
  --bg-deep: #030712;
  --panel-bg: rgba(10, 16, 30, 0.88);
  --panel-border: rgba(56, 189, 248, 0.25);
  --cyan: #00c2ff;
  --cyan-glow: rgba(0, 194, 255, 0.45);
  --text-main: #ffffff;
  --text-muted: #94a3b8;
  --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --trans: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: var(--bg-deep); color: var(--text-main);
  font-family: var(--font); user-select: none;
  -webkit-font-smoothing: antialiased;
}

/* ══════════════════════════════════════════════
   VIEWPORT & 3D CANVAS
══════════════════════════════════════════════ */
#viewer-container {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  overflow: hidden;
}
#three-canvas {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block; z-index: 1;
}

/* Photographic Backdrop Layer */
#photo-backdrop {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  z-index: 0;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
  transform-origin: center center;
}
#photo-backdrop.dollhouse-mode {
  opacity: 0.15;
  filter: blur(12px) brightness(0.4);
  transform: scale(0.9);
}

/* ══════════════════════════════════════════════
   TOP NAVIGATION BAR
══════════════════════════════════════════════ */
#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 60px; z-index: 500;
  background: linear-gradient(180deg, rgba(3, 7, 18, 0.95) 0%, rgba(3, 7, 18, 0.7) 70%, transparent 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.brand-group { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
  color: #fff; text-decoration: none; display: flex; align-items: center; gap: 6px;
}
.brand-logo span { color: var(--cyan); }
.brand-badge {
  font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
  color: var(--cyan); background: rgba(0, 194, 255, 0.12);
  border: 1px solid var(--panel-border); border-radius: 20px;
  padding: 4px 10px; display: flex; align-items: center; gap: 6px;
}
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
  animation: pulse-dot 1.8s infinite;
}
@keyframes pulse-dot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } }

.top-actions { display: flex; align-items: center; gap: 10px; }
.btn-ui {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px; color: rgba(255, 255, 255, 0.85);
  font-size: 12px; font-weight: 600; padding: 7px 14px;
  cursor: pointer; transition: var(--trans); text-decoration: none;
}
.btn-ui:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.25); color: #fff;
}
.btn-ui.primary {
  background: #0284c7; border-color: #38bdf8; color: #fff;
  box-shadow: 0 0 16px rgba(2, 132, 199, 0.4);
}
.btn-ui.primary:hover { background: #0369a1; box-shadow: 0 0 20px rgba(56, 189, 248, 0.6); }

/* ══════════════════════════════════════════════
   MATTERPORT VIEW MODE TOOLBAR (Bottom Center)
══════════════════════════════════════════════ */
#mode-toolbar {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 500;
  display: flex; align-items: center; gap: 6px;
  background: rgba(8, 14, 26, 0.92);
  backdrop-filter: blur(20px);
  border: 1px solid var(--panel-border);
  border-radius: 40px; padding: 6px 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 194, 255, 0.15);
}
.mode-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: 30px;
  font-size: 12px; font-weight: 700; border: none;
  background: transparent; color: var(--text-muted);
  cursor: pointer; transition: var(--trans);
}
.mode-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
.mode-btn.active {
  background: var(--cyan); color: #030712;
  box-shadow: 0 0 14px var(--cyan-glow);
}
.toolbar-sep { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.12); margin: 0 2px; }

/* ══════════════════════════════════════════════
   MATTERPORT FLOOR RADAR / MINIMAP (Bottom Left)
══════════════════════════════════════════════ */
#floor-radar-card {
  position: fixed; bottom: 24px; left: 24px;
  z-index: 500;
  width: 170px; height: 170px;
  background: rgba(8, 14, 26, 0.9);
  backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: 16px; padding: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  display: flex; flex-direction: column;
}
.radar-header {
  font-size: 10px; font-weight: 800; letter-spacing: 1px;
  color: var(--cyan); text-transform: uppercase; margin-bottom: 6px;
  display: flex; justify-content: space-between; align-items: center;
}
#radar-canvas {
  width: 100%; height: 100%; flex: 1;
  background: rgba(255, 255, 255, 0.02);
  border-radius: 8px; border: 1px dashed rgba(255, 255, 255, 0.1);
  cursor: pointer;
}

/* ══════════════════════════════════════════════
   SPATIAL NODE LIST (Left Floating Sidebar)
══════════════════════════════════════════════ */
#node-drawer {
  position: fixed; top: 80px; left: 24px;
  z-index: 450;
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(8, 14, 26, 0.85);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px; padding: 10px;
  max-height: calc(100vh - 290px); overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}
.node-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 8px;
  background: transparent; border: 1px solid transparent;
  color: rgba(255, 255, 255, 0.7); font-size: 11.5px; font-weight: 600;
  cursor: pointer; transition: var(--trans); text-align: left;
  white-space: nowrap;
}
.node-btn:hover {
  background: rgba(255, 255, 255, 0.08); color: #fff;
}
.node-btn.active {
  background: rgba(0, 194, 255, 0.15);
  border-color: var(--panel-border); color: var(--cyan);
}
.node-icon { font-size: 14px; }

/* ══════════════════════════════════════════════
   3D MATTERTAGS (Floating Pins in Space)
══════════════════════════════════════════════ */
.mattertag-element {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: all; cursor: pointer;
  z-index: 200;
}
.mattertag-beacon {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(0, 194, 255, 0.35);
  border: 2px solid var(--cyan);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 16px var(--cyan);
  transition: transform 0.2s ease, background 0.2s ease;
  animation: beacon-pulse 2.2s infinite;
}
@keyframes beacon-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(0, 194, 255, 0.7); }
  70%  { box-shadow: 0 0 0 16px rgba(0, 194, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 194, 255, 0); }
}
.mattertag-beacon::after {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: #ffffff;
}
.mattertag-element:hover .mattertag-beacon {
  transform: scale(1.25);
  background: rgba(0, 194, 255, 0.7);
}

.mattertag-card {
  position: absolute; bottom: 36px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: rgba(7, 12, 22, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--cyan);
  border-radius: 12px; padding: 12px 16px;
  width: 220px; pointer-events: none;
  opacity: 0; transition: var(--trans);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 194, 255, 0.25);
}
.mattertag-element:hover .mattertag-card {
  opacity: 1; transform: translateX(-50%) translateY(0);
}
.tag-badge { font-size: 9px; font-weight: 800; color: var(--cyan); letter-spacing: 0.8px; text-transform: uppercase; }
.tag-title { font-size: 13px; font-weight: 700; color: #fff; margin: 2px 0 4px; }
.tag-desc  { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
.tag-cta   { font-size: 10px; font-weight: 700; color: var(--cyan); margin-top: 6px; display: flex; align-items: center; gap: 4px; }

/* ══════════════════════════════════════════════
   PRODUCT SPECIFICATION MODAL
══════════════════════════════════════════════ */
#product-modal {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none; transition: var(--trans);
}
#product-modal.open { opacity: 1; pointer-events: all; }
.modal-box {
  background: #0b1526; border: 1px solid var(--panel-border);
  border-radius: 20px; width: 100%; max-width: 600px;
  padding: 28px; position: relative;
  box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 30px rgba(0, 194, 255, 0.2);
  transform: scale(0.95); transition: var(--trans);
}
#product-modal.open .modal-box { transform: scale(1); }
.modal-close {
  position: absolute; top: 20px; right: 20px;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: none;
  color: #fff; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: rgba(255,255,255,0.2); }
.spec-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin: 18px 0;
}
.spec-item {
  background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px 14px;
}
.spec-k { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
.spec-v { font-size: 13px; font-weight: 700; color: #fff; margin-top: 2px; }

/* ══════════════════════════════════════════════
   TOAST NOTIFICATION
══════════════════════════════════════════════ */
#toast {
  position: fixed; top: 76px; left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(8, 14, 26, 0.95);
  border: 1px solid var(--cyan); border-radius: 30px;
  padding: 8px 20px; font-size: 12px; font-weight: 600; color: #fff;
  z-index: 600; opacity: 0; pointer-events: none; transition: var(--trans);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 15px var(--cyan-glow);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- Photographic Backdrop Layer (Real 100% Photos) -->
<div id="photo-backdrop"></div>

<!-- 3D WebGL Canvas Layer (Three.js Spatial Graph, Pucks, Mattertags) -->
<div id="viewer-container">
  <canvas id="three-canvas"></canvas>
  <div id="mattertags-host"></div>
</div>

<!-- Top Bar -->
<header id="topbar">
  <div class="brand-group">
    <a href="/demo.html" class="brand-logo">dn'<span>a</span> ROBOTIC</a>
    <div class="brand-badge">
      <span class="pulse-dot"></span>
      Matterport 3D Digital Twin
    </div>
  </div>
  <div class="top-actions">
    <a href="/demo.html" class="btn-ui">← 3D 쇼룸</a>
    <a href="/demo-splat.html" class="btn-ui">🔬 3DGS 뷰어</a>
    <button class="btn-ui" onclick="toggleFullscreen()">⛶ 전체화면</button>
    <button class="btn-ui primary" onclick="openRFQ()">📋 RFQ 견적 요청</button>
  </div>
</header>

<!-- Left Vantage Node List -->
<nav id="node-drawer">
  <div style="font-size:10px; font-weight:800; color:var(--cyan); letter-spacing:1px; margin-bottom:4px; padding:0 6px;">
    SPATIAL NODES
  </div>

    <span class="node-icon">🔭</span> 01. 부스 메인 조망 (Entrance)

    <span class="node-icon">🤖</span> 02. 전면 코봇 라인업 (Robots)
  </button>
  <button class="node-btn" id="nbtn-2" onclick="switchNode(2)">
    <span class="node-icon">⬡</span> 03. 메인 로봇 스테이션 (Center)
  </button>
  <button class="node-btn" id="nbtn-3" onclick="switchNode(3)">
    <span class="node-icon">⚙️</span> 04. AMR & 센서 존 (Runway)
  </button>
  <button class="node-btn" id="nbtn-4" onclick="switchNode(4)">
    <span class="node-icon">🖥️</span> 05. AI 비전 미디어 월 (LED Wall)
  </button>
  <button class="node-btn" id="nbtn-5" onclick="switchNode(5)">
    <span class="node-icon">🛋️</span> 06. VIP 라운지 & 상담 (Lounge)
  </button>
</nav>

<!-- Floor Radar / Minimap -->
<div id="floor-radar-card">

    <span>BOOTH RADAR</span>
    <span id="radar-loc-txt" style="color:#fff; font-size:9px;">01. ENTRANCE</span>
  </div>
  <canvas id="radar-canvas" width="146" height="116"></canvas>
</div>

<!-- Matterport Mode Switcher Toolbar -->
<div id="mode-toolbar">
  <button class="mode-btn active" id="btn-mode-tour" onclick="setMode('tour')">
    <span>📸</span> 실사 공간 투어
  </button>
  <button class="mode-btn" id="btn-mode-dollhouse" onclick="setMode('dollhouse')">
    <span>🏠</span> 3D Dollhouse
  </button>
  <button class="mode-btn" id="btn-mode-floor" onclick="setMode('floor')">
    <span>🗺️</span> 2D 평면도
  </button>
  <div class="toolbar-sep"></div>
  <button class="mode-btn" id="btn-autotour" onclick="toggleAutoTour()">
    <span>▶</span> AUTO TOUR
  </button>
</div>

<!-- Product Detail Modal -->
<div id="product-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div style="font-size:10px; font-weight:800; color:var(--cyan); letter-spacing:1px; text-transform:uppercase;" id="m-badge">
      INDUSTRIAL COLLABORATIVE ROBOT
    </div>
    <h2 style="font-size:24px; font-weight:800; color:#fff; margin:6px 0 2px;" id="m-name">
      DN'a Apex CoBot X16
    </h2>
    <p style="font-size:12px; color:var(--text-muted); line-height:1.6;" id="m-desc">
      고정밀 6축 협동로봇 — 가반하중 16kg, 도달반경 1300mm, 반복정밀도 ±0.025mm. 인간-로봇 안전 협업 인증.
    </p>
    <div class="spec-grid" id="m-specs"></div>
    <div style="display:flex; gap:10px; margin-top:20px;">
      <button class="btn-ui primary" style="flex:1; justify-content:center; padding:12px;" onclick="openRFQ()">
        📝 RFQ 즉시 견적 요청
      </button>
      <button class="btn-ui" style="padding:12px;" onclick="closeModal()">
        닫기
      </button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast">알림 메시지</div>

    id: 'ai-screen',
    badge: 'Digital Media Wall',
    title: "AI · Vision · Automation LED Wall",
    desc: '16:9 대형 미디어 파사드 — 실시간 스마트 팩토리 대시보드 및 로봇 제어 현황 표출',
    nodeId: 0,
    worldPos: new THREE.Vector3(-3.5, 2.4, 6.0),
    specs: [
      ['해상도', '4K UHD Fine-Pitch'], ['휘도', '1200 nits'],
      ['화면크기', '6000 x 3400 mm'], ['인터페이스', 'Real-time Telemetry']
    ]
  }
];

let currentNodeIdx = 0;
let currentMode = 'tour'; // 'tour' | 'dollhouse' | 'floor'
let scene, camera, renderer, controls;
let floorPucks = [];
let autoTourActive = false, autoTourTimer = null;

// ── 3. THREE.JS SPATIAL SCENE INITIALIZATION ──
function initThree() {
  const container = document.getElementById('viewer-container');
  const canvas = document.getElementById('three-canvas');

  scene = new THREE.Scene();
  
  camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.6, -7.0);

  renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.target.set(0, 1.5, 2.0);
  controls.minDistance = 0.5;
  controls.maxDistance = 35;
  controls.maxPolarAngle = Math.PI * 0.88;

  // Build 3D Floor Pucks (Matterport-style navigation rings)
  buildFloorPucks();

  // Build 3D Dollhouse Wireframe Boundary
  buildDollhouseMesh();

  // Create Mattertags DOM elements
  buildMattertagsDOM();

  window.addEventListener('resize', onResize);
  requestAnimationFrame(animate);

  // Set Initial Node
  switchNode(0);
}

// ── 4. BUILD FLOOR PUCKS (Glowing Rings) ──
function buildFloorPucks() {
  SPATIAL_NODES.forEach((node, idx) => {
    const puckGroup = new THREE.Group();
    puckGroup.position.set(node.floorPos.x, 0.02, node.floorPos.z);

    // Outer Ring
    const ringGeo = new THREE.RingGeometry(0.35, 0.45, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00c2ff, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI * 0.5;
    puckGroup.add(ring);

    // Inner Disc
    const discGeo = new THREE.CircleGeometry(0.25, 24);
    const discMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
    const disc = new THREE.Mesh(discGeo, discMat);
    disc.rotation.x = -Math.PI * 0.5;
    puckGroup.add(disc);

    puckGroup.userData = { nodeId: idx };
    scene.add(puckGroup);
    floorPucks.push(puckGroup);
  });

  // Click on floor puck to teleport
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  window.addEventListener('pointerdown', (e) => {
    if (e.target.tagName !== 'CANVAS') return;
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);

    const intersects = raycaster.intersectObjects(floorPucks, true);
    if (intersects.length > 0) {
      let target = intersects[0].object;
      while (target.parent && target.userData.nodeId === undefined) target = target.parent;
      if (target.userData && target.userData.nodeId !== undefined) {
        switchNode(target.userData.nodeId);
      }
    }
  });
}

// ── 5. DOLLHOUSE 3D WIREFRAME MESH ──
let dollhouseGroup;
function buildDollhouseMesh() {
  dollhouseGroup = new THREE.Group();

  // Booth Perimeter
  const floorMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, transparent: true, opacity: 0.12, side: THREE.DoubleSide });
  const floorMesh = new THREE.Mesh(new THREE.PlaneGeometry(14, 14), floorMat);
  floorMesh.rotation.x = -Math.PI * 0.5;
  floorMesh.position.set(0, 0, 1.5);
  dollhouseGroup.add(floorMesh);

  // Booth Grid Box Lines
  const gridHelper = new THREE.GridHelper(14, 14, 0x00c2ff, 0x1e293b);
  gridHelper.position.set(0, 0.01, 1.5);
  dollhouseGroup.add(gridHelper);

  dollhouseGroup.visible = false;
  scene.add(dollhouseGroup);
}

// ── 6. MATTERTAGS DOM ATTACHMENT ──
function buildMattertagsDOM() {
  const host = document.getElementById('mattertags-host');
  MATTERTAGS.forEach((tag, idx) => {
    const el = document.createElement('div');
    el.className = 'mattertag-element';
    el.id = 'mtag-' + idx;
    el.innerHTML = `
      <div class="mattertag-beacon"></div>
      <div class="mattertag-card">
        <div class="tag-badge">${tag.badge}</div>
        <div class="tag-title">${tag.title}</div>
        <div class="tag-desc">${tag.desc}</div>
        <div class="tag-cta">클릭하여 정밀 스펙 확인 →</div>
      </div>
    `;
    el.addEventListener('click', () => openProductModal(idx));
    host.appendChild(el);
    tag.domElement = el;
  });
}

// ── 7. SPATIAL NODE TRANSITION (Matterport Fly-in) ──
function switchNode(idx) {
  currentNodeIdx = idx;
  const node = SPATIAL_NODES[idx];

  // Update UI tabs
  document.querySelectorAll('.node-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.getElementById('radar-loc-txt').textContent = node.name.toUpperCase();

  // Crossfade Photo Backdrop
  const backdrop = document.getElementById('photo-backdrop');
  backdrop.style.opacity = '0.3';
  backdrop.style.transform = 'scale(1.05)';
  
  setTimeout(() => {
    backdrop.style.backgroundImage = `url("${node.image}")`;
    backdrop.style.opacity = currentMode === 'dollhouse' ? '0.15' : '1';
    backdrop.style.transform = currentMode === 'dollhouse' ? 'scale(0.9)' : 'scale(1.0)';
  }, 250);

  // Smooth Camera Fly-To Interpolation
  if (currentMode === 'tour') {
    new TWEEN.Tween(camera.position)
      .to({ x: node.floorPos.x, y: 1.6, z: node.floorPos.z }, 900)
      .easing(TWEEN.Easing.Cubic.Out)
      .start();

    new TWEEN.Tween(controls.target)
      .to({ x: node.camLook.x, y: node.camLook.y, z: node.camLook.z }, 900)
      .easing(TWEEN.Easing.Cubic.Out)
      .start();
  }

  // Update Floor Puck Opacities
  floorPucks.forEach((puck, i) => {
    const isCurrent = (i === idx);
    puck.children[0].material.opacity = isCurrent ? 0.3 : 0.85;
    puck.children[1].material.opacity = isCurrent ? 0.4 : 0.9;
  });

  drawRadar();
  showToast(`📍 ${node.name} 시점으로 이동했습니다.`);
}

// ── 8. VIEW MODE CONTROLLER ──
function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-mode-tour').classList.toggle('active', mode === 'tour');
  document.getElementById('btn-mode-dollhouse').classList.toggle('active', mode === 'dollhouse');
  document.getElementById('btn-mode-floor').classList.toggle('active', mode === 'floor');

  const backdrop = document.getElementById('photo-backdrop');

  if (mode === 'tour') {
    dollhouseGroup.visible = false;
    backdrop.classList.remove('dollhouse-mode');
    const node = SPATIAL_NODES[currentNodeIdx];
    new TWEEN.Tween(camera.position).to({ x: node.floorPos.x, y: 1.6, z: node.floorPos.z }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
    new TWEEN.Tween(controls.target).to({ x: node.camLook.x, y: node.camLook.y, z: node.camLook.z }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
    showToast('📸 100% 실사 사진 공간 투어 모드');
  } else if (mode === 'dollhouse') {
    dollhouseGroup.visible = true;
    backdrop.classList.add('dollhouse-mode');
    new TWEEN.Tween(camera.position).to({ x: 0, y: 12.0, z: -14.0 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
    new TWEEN.Tween(controls.target).to({ x: 0, y: 0.5, z: 1.5 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
    showToast('🏠 3D Dollhouse 입체 투시도 모드 (바닥 링을 클릭해 실사 공간으로 진입)');
  } else if (mode === 'floor') {
    dollhouseGroup.visible = true;
    backdrop.classList.add('dollhouse-mode');
    new TWEEN.Tween(camera.position).to({ x: 0, y: 18.0, z: 1.51 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
    new TWEEN.Tween(controls.target).to({ x: 0, y: 0, z: 1.5 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
    showToast('🗺️ 2D 부스 평면도 모드');
  }
}

// ── 9. AUTO TOUR ENGINE ──
function toggleAutoTour() {
  const btn = document.getElementById('btn-autotour');
  if (autoTourActive) {
    clearInterval(autoTourTimer);
    autoTourActive = false;
    btn.classList.remove('active');
    btn.innerHTML = '<span>▶</span> AUTO TOUR';
    showToast('⏹ 자동 투어 정지');
  } else {
    autoTourActive = true;
    btn.classList.add('active');
    btn.innerHTML = '<span>⏹</span> 투어 정지';
    showToast('▶ 4.5초 간격 Matterport 자동 가이드 투어 시작');
    
    let nextIdx = (currentNodeIdx + 1) % SPATIAL_NODES.length;
    switchNode(nextIdx);
    autoTourTimer = setInterval(() => {
      nextIdx = (currentNodeIdx + 1) % SPATIAL_NODES.length;
      switchNode(nextIdx);
    }, 4800);
  }
}

// ── 10. 2D FLOOR RADAR MINIMAP ──
function drawRadar() {
  const cvs = document.getElementById('radar-canvas');
  if (!cvs) return;
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, cvs.width, cvs.height);

  // Booth Box
  ctx.strokeStyle = '#00c2ff';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(16, 12, 114, 92);

  // Canopy Pillars
  ctx.fillStyle = '#ffffff';
  [[16,12],[130,12],[16,104],[130,104]].forEach(([x,y]) => {
    ctx.fillRect(x-2, y-2, 5, 5);
  });

  // Nodes Dots
  SPATIAL_NODES.forEach((n, idx) => {
    const isCur = (idx === currentNodeIdx);
    ctx.beginPath();
    ctx.arc(n.radarPos.x, n.radarPos.y, isCur ? 6 : 3.5, 0, Math.PI*2);
    ctx.fillStyle = isCur ? '#00c2ff' : 'rgba(255,255,255,0.4)';
    ctx.fill();
    if (isCur) {
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  });

  // User Viewing Cone
  const cur = SPATIAL_NODES[currentNodeIdx];
  const angle = Math.atan2(controls.target.x - camera.position.x, controls.target.z - camera.position.z);
  ctx.fillStyle = 'rgba(0, 194, 255, 0.2)';
  ctx.beginPath();
  ctx.moveTo(cur.radarPos.x, cur.radarPos.y);
  ctx.arc(cur.radarPos.x, cur.radarPos.y, 24, angle - 0.4, angle + 0.4);
  ctx.closePath();
  ctx.fill();
}

// ── 11. MATTERTAGS SCREEN PROJECTION ──
function updateMattertags() {
  MATTERTAGS.forEach(tag => {
    if (!tag.domElement) return;
    const wp = tag.worldPos.clone();
    wp.project(camera);

    // Behind camera check
    if (wp.z > 1.0) {
      tag.domElement.style.display = 'none';
      return;
    }
    tag.domElement.style.display = currentMode === 'tour' ? 'block' : 'none';

    const sx = (wp.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (-(wp.y * 0.5) + 0.5) * window.innerHeight;
    tag.domElement.style.left = sx + 'px';
    tag.domElement.style.top = sy + 'px';
  });
}

// ── 12. PRODUCT MODAL ──
function openProductModal(idx) {
  const p = MATTERTAGS[idx];
  if (!p) return;
  document.getElementById('m-badge').textContent = p.badge;
  document.getElementById('m-name').textContent = p.title;
  document.getElementById('m-desc').textContent = p.desc;
  document.getElementById('m-specs').innerHTML = p.specs.map(([k, v]) => `
    <div class="spec-item"><div class="spec-k">${k}</div><div class="spec-v">${v}</div></div>
  `).join('');
  document.getElementById('product-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('product-modal').classList.remove('open');
}
function openRFQ() {
  window.open('mailto:sales@dna-robotic.com?subject=RFQ from Matterport Digital Twin&body=Matterport 3D 디지털 트윈 투어를 통해 제품 견적을 문의합니다.');
}
function toggleFullscreen() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ── 13. RENDER LOOP ──
function animate(time) {
  requestAnimationFrame(animate);
  TWEEN.update(time);
  controls.update();
  updateMattertags();
  drawRadar();
  renderer.render(scene, camera);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// Start
document.addEventListener('DOMContentLoaded', initThree);
</script>
</body>
