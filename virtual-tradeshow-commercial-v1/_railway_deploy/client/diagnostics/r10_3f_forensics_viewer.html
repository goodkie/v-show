<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>R10.3F Gaussian Visual Quality Forensics Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #070a12; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    #canvas-container { position: fixed; inset: 0; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 12px; left: 12px; z-index: 100;
      background: rgba(15, 23, 42, 0.92); border: 1px solid #334155;
      padding: 10px 16px; border-radius: 8px; color: #f8fafc; font-size: 12px;
      line-height: 1.5; pointer-events: none;
    }
    #hud b { color: #38bdf8; }
    #status { color: #f59e0b; font-weight: 600; }
  </style>
</head>
<body>
  <div id="hud">
    <div><b>PHASE 10.7N-R10.3F FORENSICS VIEWER</b></div>
    <div id="hud-model">Model: WILO_AUTHENTIC_PARTIAL_EXPERIMENT_01.ply</div>
    <div id="hud-cam">Camera: Pos=[0, 0, 12], Target=[0, 0, 0]</div>
    <div id="hud-rot">Model Rotation: [0, 0, 0] deg</div>
    <div id="status">INITIALIZING...</div>
  </div>

  <div id="canvas-container"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.5/build/gaussian-splats-3d.module.js';
    import * as THREE from 'three';

    let viewer = null;
    let splatScene = null;
    window.__READY__ = false;
    window.__ERROR__ = null;

    // Parse URL parameters
    const params = new URLSearchParams(window.location.search);
    const modelFormat = params.get('format') || 'ply';
    const rotX = parseFloat(params.get('rx') || '0') * Math.PI / 180;
    const rotY = parseFloat(params.get('ry') || '0') * Math.PI / 180;
    const rotZ = parseFloat(params.get('rz') || '0') * Math.PI / 180;
    
    const camX = parseFloat(params.get('cx') || '0');
    const camY = parseFloat(params.get('cy') || '0');
    const camZ = parseFloat(params.get('cz') || '14');
    
    const tarX = parseFloat(params.get('tx') || '0');
    const tarY = parseFloat(params.get('ty') || '0');
    const tarZ = parseFloat(params.get('tz') || '0');

    const modelUrl = modelFormat === 'spz' 
      ? '/assets/demo/wilo/experimental/WILO_AUTHENTIC_PARTIAL_EXPERIMENT_01.spz'
      : '/assets/demo/wilo/experimental/WILO_AUTHENTIC_PARTIAL_EXPERIMENT_01.ply';

    document.getElementById('hud-model').textContent = `Model: ${modelUrl.split('/').pop()} (${modelFormat.toUpperCase()})`;
    document.getElementById('hud-cam').textContent = `Cam Pos=[${camX.toFixed(2)}, ${camY.toFixed(2)}, ${camZ.toFixed(2)}] Target=[${tarX.toFixed(2)}, ${tarY.toFixed(2)}, ${tarZ.toFixed(2)}]`;
    document.getElementById('hud-rot').textContent = `Rotation: [${params.get('rx')||0}°, ${params.get('ry')||0}°, ${params.get('rz')||0}°]`;

    async function init() {
      try {
        const container = document.getElementById('canvas-container');

        viewer = new GaussianSplats3D.Viewer({
          rootElement: container,
          selfDrivenMode: true,
          useBuiltInControls: true,
          initialCameraPosition: [camX, camY, camZ],
          initialCameraLookAt: [tarX, tarY, tarZ],
          cameraUp: [0, 1, 0],
          sharedMemoryForWorkers: false,
          enableSplatSort: true,
          dynamicScene: false,
          freeIntermediateSplatData: true,
          antialiased: true
        });

        // Convert Euler rotation to Quaternion
        const euler = new THREE.Euler(rotX, rotY, rotZ, 'XYZ');
        const q = new THREE.Quaternion().setFromEuler(euler);

        document.getElementById('status').textContent = 'LOADING GAUSSIAN DATA...';

        viewer.addSplatScene(modelUrl, {
          splatAlphaRemovalThreshold: 5,
          showLoadingUI: false,
          position: [0, 0, 0],
          rotation: [q.x, q.y, q.z, q.w],
          scale: [1, 1, 1],
        })
        .then((scene) => {
          splatScene = scene;
          document.getElementById('status').textContent = 'RENDER READY';
          document.getElementById('status').style.color = '#10b981';
          window.__READY__ = true;
          console.log('[R10_3F] Scene loaded and render ready');
        })
        .catch(err => {
          document.getElementById('status').textContent = 'LOAD ERROR: ' + err.message;
          document.getElementById('status').style.color = '#ef4444';
          window.__ERROR__ = err.message;
          console.error('[R10_3F] Error loading scene:', err);
        });

        viewer.start();

        // Expose control functions
        window.setCameraPose = function(pos, target) {
          viewer.camera.position.set(pos[0], pos[1], pos[2]);
          viewer.controls.target.set(target[0], target[1], target[2]);
          viewer.controls.update();
        };

      } catch (err) {
        document.getElementById('status').textContent = 'INIT FAILED: ' + err.message;
        document.getElementById('status').style.color = '#ef4444';
        window.__ERROR__ = err.message;
        console.error('[R10_3F] Fatal init error:', err);
      }
    }

    init();
  </script>
</body>
</html>
