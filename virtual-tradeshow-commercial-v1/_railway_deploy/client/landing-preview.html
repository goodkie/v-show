<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>3D2R — Official Release</title>
  <link rel="icon" type="image/png" href="/assets/3d2r-logo-source.png"/>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      color: #f6f6f3;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    button { font: inherit; color: inherit; }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 48%, #121212 0, #080808 30%, #050505 68%);
      isolation: isolate;
    }
    canvas#p {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      background: radial-gradient(circle at center, transparent 0 22%, rgba(0,0,0,.3) 62%, rgba(0,0,0,.9) 100%);
    }

    /* Top Brand Logo Contract */
    .brand-logo-only {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .brand-logo-only img {
      display: block;
      width: 21px;
      height: auto;
      object-fit: contain;
      background: transparent;
      image-rendering: -webkit-optimize-contrast;
    }
    @media (max-width: 640px) {
      .brand-logo-only { top: 18px; }
      .brand-logo-only img { width: 18px; }
    }

    /* Bottom Microcopy Contract */
    .tiny-footer {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      font-size: 9px;
      letter-spacing: .28em;
      color: #777;
      white-space: nowrap;
      text-transform: uppercase;
      pointer-events: none;
      user-select: none;
    }
    @media (max-width: 640px) {
      .tiny-footer { bottom: 20px; font-size: 8px; letter-spacing: .22em; }
    }

    /* Center CTA: StartPortal Interaction Contract */
    .start-portal {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 190px;
      height: 190px;
      border: 0;
      background: transparent;
      cursor: pointer;
      display: grid;
      place-items: center;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .portal-grow-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .34);
      background: rgba(8, 8, 8, .28);
      transform: translate(-50%, -50%);
      transition: width .44s cubic-bezier(.2, .8, .2, 1),
                  height .44s cubic-bezier(.2, .8, .2, 1),
                  border-color .44s ease,
                  background .44s ease;
      pointer-events: none;
    }
    .portal-label {
      position: relative;
      z-index: 2;
      font-size: 13px;
      font-weight: 650;
      letter-spacing: .31em;
      margin-left: .31em;
      color: rgba(255, 255, 255, .92);
      transition: color .28s ease;
      pointer-events: none;
    }

    /* Hover & Keyboard Focus States */
    .start-portal:hover .portal-grow-ring,
    .start-portal:focus-visible .portal-grow-ring,
    .start-portal.is-active .portal-grow-ring {
      width: 148px;
      height: 148px;
      border-color: #ffffff;
      background: #ffffff;
    }
    .start-portal:hover .portal-label,
    .start-portal:focus-visible .portal-label,
    .start-portal.is-active .portal-label {
      color: #050505;
    }
    .start-portal:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.4);
      outline-offset: 4px;
      border-radius: 50%;
    }
    @media (max-width: 740px) {
      .start-portal { width: 170px; height: 170px; }
      .start-portal:hover .portal-grow-ring,
      .start-portal:focus-visible .portal-grow-ring,
      .start-portal.is-active .portal-grow-ring {
        width: 136px;
        height: 136px;
      }
    }

    /* Portal Expansion Transition Animation */
    .portal-expansion {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 168px;
      height: 168px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(.01);
      background: #090909;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
    }
    .portal-expansion.run {
      opacity: 1;
      animation: portalOpen .82s cubic-bezier(.72, .02, .18, 1) forwards;
    }
    @keyframes portalOpen {
      0% {
        transform: translate(-50%, -50%) scale(.01);
        box-shadow: 0 0 0 0 rgba(255, 255, 255, .12);
      }
      22% {
        transform: translate(-50%, -50%) scale(1.05);
        box-shadow: 0 0 0 12px rgba(255, 255, 255, .05);
      }
      100% {
        transform: translate(-50%, -50%) scale(18);
        box-shadow: 0 0 0 0 transparent;
      }
    }

    /* Accessibility: Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .001ms !important;
      }
    }
  
    /* ═══════════════════════════════════════════════════════════════════════════════ */
    /* ─── 3D2R MINIMAL 3-STAGE CONNECTED FLOW COMPONENT (ROUND 115) ───────────── */
    /* ═══════════════════════════════════════════════════════════════════════════════ */
    .flow-pipeline-container {
      display: flex;
      align-items: stretch;
      justify-content: center;
      gap: 16px;
      max-width: 980px;
      margin: 0 auto 28px auto;
      padding: 6px 4px;
      box-sizing: border-box;
      width: 100%;
    }

    .flow-node {
      flex: 1 1 0;
      min-width: 240px;
      background: rgba(11, 21, 38, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      box-sizing: border-box;
    }

    /* Active Entry Node (Stage 1) */
    .flow-node.active-entry {
      background: rgba(14, 27, 49, 0.92);
      border: 1.5px solid rgba(56, 189, 248, 0.55);
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.6), 0 0 30px rgba(14, 165, 233, 0.18);
    }
    .flow-node.active-entry:hover {
      border-color: #38bdf8;
      transform: translateY(-2px);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.25);
    }

    /* Downstream Nodes (Stage 2 & Stage 3) */
    .flow-node.downstream-node {
      background: rgba(8, 14, 26, 0.65);
      border: 1px dashed rgba(255, 255, 255, 0.16);
      opacity: 0.92;
    }
    .flow-node.downstream-node:hover {
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    /* Badge Row */
    .node-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .node-number {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .active-entry .node-number {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .node-status-pill {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .active-pill {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }
    .downstream-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
    }
    .conversion-pill {
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.4);
      color: #34d399;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
      box-shadow: 0 0 6px #34d399;
      animation: pulseDot 1.8s infinite;
    }
    @keyframes pulseDot {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }

    /* Title & Sublabel */
    .node-title-group {
      margin-bottom: 16px;
      text-align: left;
    }
    .node-icon {
      font-size: 22px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    .downstream-node .node-icon {
      color: #94a3b8;
    }
    #flowNode3 .node-icon {
      color: #34d399;
    }
    .node-heading {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.3px;
      margin-bottom: 4px;
    }
    .node-sublabel {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }

    /* Actions Container */
    .node-actions-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }

    /* Action Buttons */
    .btn-flow-action {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      text-align: left;
      transition: all 0.2s ease;
      box-sizing: border-box;
      text-decoration: none;
    }
    .btn-flow-action i {
      font-size: 16px;
      flex-shrink: 0;
    }
    .btn-text-wrap {
      display: flex;
      flex-direction: column;
    }
    .btn-main-txt {
      font-size: 13px;
      font-weight: 800;
      line-height: 1.2;
    }
    .btn-sub-txt {
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.05em;
      opacity: 0.8;
      margin-top: 1px;
    }

    /* Primary Flow Button (실시간 촬영) */
    .btn-flow-primary {
      background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
      border: 1px solid #38bdf8;
      color: #fff;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
    }
    .btn-flow-primary:hover {
      background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.5);
      transform: translateY(-1px);
    }
    .btn-flow-primary:active {
      transform: translateY(0);
    }

    /* Secondary Flow Button (사진 업로드) */
    .btn-flow-secondary {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #f1f5f9;
    }
    .btn-flow-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.28);
      color: #fff;
      transform: translateY(-1px);
    }

    /* Downstream Indicator */
    .downstream-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: auto;
      line-height: 1.35;
    }
    .downstream-indicator i {
      color: #38bdf8;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* Outline Viewer Button (shown if active viewer exists) */
    .btn-flow-outline {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
    }
    .btn-flow-outline:hover {
      background: rgba(56, 189, 248, 0.22);
      border-color: #38bdf8;
      color: #fff;
    }

    /* Buyer Intent Button (Stage 3) */
    .btn-flow-buyer {
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.45);
      color: #34d399;
    }
    .btn-flow-buyer:hover {
      background: rgba(52, 211, 153, 0.24);
      border-color: #34d399;
      color: #fff;
      box-shadow: 0 4px 16px rgba(52, 211, 153, 0.3);
      transform: translateY(-1px);
    }

    /* Directional Connectors */
    .flow-connector {
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(56, 189, 248, 0.45);
      font-size: 16px;
      flex-shrink: 0;
      padding: 0 2px;
      animation: flowPulse 2.4s ease-in-out infinite;
    }
    @keyframes flowPulse {
      0% { transform: translateX(0); opacity: 0.45; }
      50% { transform: translateX(3px); opacity: 0.9; color: #38bdf8; }
      100% { transform: translateX(0); opacity: 0.45; }
    }

    /* Mobile Responsive Adjustments (S23 Ultra / Android Chrome) */
    @media (max-width: 860px) {
      .flow-pipeline-container {
        flex-direction: column;
        gap: 12px;
        padding: 0 6px;
        margin-bottom: 20px;
      }
      .flow-node {
        min-width: unset;
        width: 100%;
        padding: 16px 14px;
      }
      .flow-connector {
        transform: rotate(90deg);
        padding: 2px 0;
        margin: -4px 0;
      }
      @keyframes flowPulse {
        0% { transform: rotate(90deg) translateY(0); opacity: 0.45; }
        50% { transform: rotate(90deg) translateY(3px); opacity: 0.9; color: #38bdf8; }
        100% { transform: rotate(90deg) translateY(0); opacity: 0.45; }
      }
      .btn-flow-action {
        padding: 12px 14px;
      }
      .btn-main-txt {
        font-size: 14px;
      }
    }

</style>

</head>
<body>
  <div id="app">
    <!-- Top Brand Logo (Contract: 3D2R Logo only, no text) -->
    <div class="brand-logo-only" aria-label="3D2R Official Release">
      <img src="/assets/3d2r-logo-source.png" alt="3D2R" width="21" height="auto" />
    </div>

    <!-- 3D Particle Field Canvas -->
    <canvas id="p" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

        <!-- Center 3-Stage Flow: [1. 촬영 / 업로드] → [2. 3D 뷰어로 배포] → [3. 구매유도] -->
    <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 70px 16px 60px 16px; overflow-y: auto; -webkit-overflow-scrolling: touch; box-sizing: border-box; pointer-events: none;">
      <div style="pointer-events: auto; width: 100%; max-width: 980px;">
      <!-- ============================================================ -->
      <!-- ─── 3D2R MINIMAL 3-STAGE FLOW: [1. 촬영/업로드] → [2. 3D 뷰어 배포] → [3. 구매유도] ─ -->
      <!-- ============================================================ -->
      <div id="landing-3stage-flow" class="flow-pipeline-container" aria-label="3D2R 3-Stage Process Flow">
        <!-- STAGE 1: 촬영 / 업로드 (ACTIVE ENTRY) -->
        <div class="flow-node active-entry" id="flowNode1">
          <div class="node-badge-row">
            <span class="node-number">1</span>
            <span class="node-status-pill active-pill"><span class="pulse-dot"></span> ACTIVE ENTRY</span>
          </div>
          <div class="node-title-group">
            <div class="node-icon"><i class="fa-solid fa-camera-rotate"></i></div>
            <div class="node-heading">1. 촬영 / 업로드</div>
            <div class="node-sublabel">실시간 360° 촬영 또는 사진 업로드</div>
          </div>

            <button type="button" id="btnLandingRealtimeCapture" class="btn-flow-action btn-flow-primary" onclick="window.triggerLandingRealtimeCapture()">

              <div class="btn-text-wrap">

                <span class="btn-sub-txt">I'M READY TO CAPTURE</span>
              </div>
            </button>
            <button type="button" id="btnLandingUploadPhotos" class="btn-flow-action btn-flow-secondary" onclick="window.triggerLandingUploadPhotos()">
              <i class="fa-solid fa-arrow-up-from-bracket"></i>
              <div class="btn-text-wrap">
                <span class="btn-main-txt">사진 업로드</span>
                <span class="btn-sub-txt">UPLOAD PHOTOS</span>
              </div>
            </button>
          </div>
        </div>

        <!-- CONNECTOR 1 -> 2 -->
        <div class="flow-connector" aria-hidden="true">
          <i class="fa-solid fa-chevron-right"></i>
        </div>

        <!-- STAGE 2: 3D 뷰어로 즉시 배포 (DOWNSTREAM NODE) -->
        <div class="flow-node downstream-node" id="flowNode2">
          <div class="node-badge-row">
            <span class="node-number">2</span>
            <span class="node-status-pill downstream-pill" id="flowNode2Status">NEXT STATE</span>
          </div>
          <div class="node-title-group">
            <div class="node-icon"><i class="fa-solid fa-cube"></i></div>
            <div class="node-heading">2. 3D 뷰어로 즉시 배포</div>
            <div class="node-sublabel">인터랙티브 3D / 360° 워크스루 자동 생성</div>
          </div>
          <div class="node-actions-container" id="flowNode2Content">
            <div class="downstream-indicator" id="flowNode2Indicator">
              <i class="fa-solid fa-wand-magic-sparkles"></i>
              <span>촬영 / 업로드 완료 시 즉시 3D 뷰어 렌더링</span>
            </div>
            <button type="button" id="btnLandingOpenViewer" class="btn-flow-action btn-flow-outline" style="display: none;" onclick="window.triggerLandingOpenViewer()">
              <i class="fa-solid fa-vr-cardboard"></i>
              <div class="btn-text-wrap">
                <span class="btn-main-txt">3D 뷰어 열기</span>
                <span class="btn-sub-txt">VIEW 3D SHOWROOM</span>
              </div>
            </button>
          </div>
        </div>

        <!-- CONNECTOR 2 -> 3 -->
        <div class="flow-connector" aria-hidden="true">
          <i class="fa-solid fa-chevron-right"></i>
        </div>

        <!-- STAGE 3: 구매유도 (BUYER CONVERSION) -->
        <div class="flow-node downstream-node" id="flowNode3">
          <div class="node-badge-row">
            <span class="node-number">3</span>
            <span class="node-status-pill conversion-pill">CONVERSION</span>
          </div>
          <div class="node-title-group">
            <div class="node-icon"><i class="fa-solid fa-handshake"></i></div>
            <div class="node-heading">3. 구매유도</div>
            <div class="node-sublabel">RFQ 견적 요청 • 샘플 신청 • 상담 문의</div>
          </div>
          <div class="node-actions-container">
            <button type="button" id="btnLandingBuyerIntent" class="btn-flow-action btn-flow-buyer" onclick="window.triggerLandingBuyerIntent()">
              <i class="fa-solid fa-file-invoice-dollar"></i>
              <div class="btn-text-wrap">
                <span class="btn-main-txt">구매 / 견적 문의</span>
                <span class="btn-sub-txt">REQUEST RFQ &amp; SAMPLE</span>
              </div>
            </button>
          </div>
        </div>
      </div>

      </div>
    </div>

    <!-- Bottom Microcopy -->
    <div class="tiny-footer" aria-hidden="true">INTERACTIVE DIGITAL TWIN PLATFORM</div>

    <!-- Fullscreen Expanding Portal Wipe -->
    <div class="portal-expansion" id="portal-expansion" aria-hidden="true"></div>
  </div>

  <script>
    (function() {
      'use strict';

      // ── PARTICLE FIELD 3D CONTRACT ──
      const cvs = document.getElementById('p');
      const ctx = cvs.getContext('2d');
      let W = 0, H = 0, dpr = 1, entered = false, autoAngle = 0;
      let viewportFit = 1, viewportCenterX = 0, viewportCenterY = 0, fitReady = false;
      let raf = 0;
      const mouse = { tx: 0, ty: 0, cx: 0, cy: 0 };
      const FOV = 760, XN = 9, YN = 5, ZN = 4, SX = 92, SY = 92, SZ = 165;

      function noise3(x, y, z, s = 0) {
        const n = Math.sin((x + 1) * 12.9898 + (y + 1) * 78.233 + (z + 1) * 37.719 + s * 19.913) * 43758.5453;
        return n - Math.floor(n);
      }

      const pts = [], links = [], pIndex = new Map();
      function pkey(x, y, z) { return x + ':' + y + ':' + z; }

      for (let z = 0; z < ZN; z++) {
        for (let y = 0; y < YN; y++) {
          for (let x = 0; x < XN; x++) {
            const jx = (noise3(x, y, z, 1) - .5) * SX * .56;
            const jy = (noise3(x, y, z, 2) - .5) * SY * .56;
            const jz = (noise3(x, y, z, 3) - .5) * SZ * .42;
            const size = .52 + Math.pow(noise3(x, y, z, 4), 1.7) * 2.45;
            const p = {
              x: (x - (XN - 1) / 2) * SX + jx,
              y: (y - (YN - 1) / 2) * SY + jy,
              z: (z - (ZN - 1) / 2) * SZ + jz,
              size, gx: x, gy: y, gz: z
            };
            pIndex.set(pkey(x, y, z), pts.length);
            pts.push(p);
          }
        }
      }

      for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        [[1, 0, 0], [0, 1, 0], [0, 0, 1]].forEach(d => {
          const j = pIndex.get(pkey(p.gx + d[0], p.gy + d[1], p.gz + d[2]));
          if (j !== undefined) links.push([i, j]);
        });
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        cvs.width = Math.round(W * dpr);
        cvs.height = Math.round(H * dpr);
        cvs.style.width = W + 'px';
        cvs.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function onPointerMove(e) {
        mouse.tx = (e.clientX / W - .5) * 2;
        mouse.ty = (e.clientY / H - .5) * 2;
      }

      function onPointerLeave() {
        mouse.tx = 0;
        mouse.ty = 0;
      }

      function rotate(p, rx, ry) {
        const cy = Math.cos(ry), sy = Math.sin(ry);
        const cx = Math.cos(rx), sx = Math.sin(rx);
        const x1 = p.x * cy + p.z * sy;
        const z1 = -p.x * sy + p.z * cy;
        return { x: x1, y: p.y * cx - z1 * sx, z: p.y * sx + z1 * cx };
      }

      function draw() {
        mouse.cx += (mouse.tx - mouse.cx) * .045;
        mouse.cy += (mouse.ty - mouse.cy) * .045;
        if (!entered) autoAngle += 0.00038;
        ctx.clearRect(0, 0, W, H);

        const rx = Math.sin(autoAngle * .7) * .055 + mouse.cy * -.22;
        const ry = autoAngle + mouse.cx * .30;
        const centerZ = 1180;

        const pr = pts.map((p, i) => {
          const r = rotate(p, rx, ry);
          const z = r.z + centerZ;
          const s = FOV / z;
          return { x: W / 2 + r.x * s, y: H / 2 + r.y * s, z, s, i };
        });

        // Fluid full-viewport fit based on projected 3D bounds
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        for (const p of pr) {
          minX = Math.min(minX, p.x);
          maxX = Math.max(maxX, p.x);
          minY = Math.min(minY, p.y);
          maxY = Math.max(maxY, p.y);
        }
        const spanX = Math.max(1, maxX - minX);
        const spanY = Math.max(1, maxY - minY);
        const targetFit = Math.max(W / spanX, H / spanY) * 1.06;
        const targetCx = (minX + maxX) * .5;
        const targetCy = (minY + maxY) * .5;

        if (!fitReady) {
          viewportFit = targetFit;
          viewportCenterX = targetCx;
          viewportCenterY = targetCy;
          fitReady = true;
        } else {
          viewportFit += (targetFit - viewportFit) * .07;
          viewportCenterX += (targetCx - viewportCenterX) * .07;
          viewportCenterY += (targetCy - viewportCenterY) * .07;
        }

        for (const p of pr) {
          p.x = W * .5 + (p.x - viewportCenterX) * viewportFit;
          p.y = H * .5 + (p.y - viewportCenterY) * viewportFit;
        }

        // Structural connection lines
        ctx.lineWidth = .55;
        for (const l of links) {
          const a = pr[l[0]], b = pr[l[1]];
          const depth = Math.max(0, Math.min(1, 1.35 - (a.z + b.z) * .5 / 1450));
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.strokeStyle = `rgba(255,255,255,${entered ? .018 : .035 + depth * .07})`;
          ctx.stroke();
        }

        // 3D Particles
        const order = pr.map((p, i) => ({ ...p, i })).sort((a, b) => b.z - a.z);
        for (const p of order) {
          const depth = Math.max(0, Math.min(1, 1.45 - p.z / 1400));
          const r = Math.max(.22, pts[p.i].size * (.55 + depth * .85) * .5);
          ctx.beginPath();
          ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${entered ? .035 : .18 + depth * .57})`;
          ctx.shadowBlur = entered ? 0 : 2 + depth * 8;
          ctx.shadowColor = `rgba(255,255,255,${.12 + depth * .32})`;
          ctx.fill();
        }
        ctx.shadowBlur = 0;

        // Subtle pointer perspective gradient
        if (!entered) {
          const gx = W / 2 + mouse.cx * W * .18;
          const gy = H / 2 + mouse.cy * H * .14;
          const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 240);
          g.addColorStop(0, 'rgba(255,255,255,.05)');
          g.addColorStop(.28, 'rgba(255,255,255,.018)');
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = g;
          ctx.fillRect(gx - 240, gy - 240, 480, 480);
        }

        raf = requestAnimationFrame(draw);
      }

      // Initialize Canvas
      resize();
      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('pointermove', onPointerMove, { passive: true });
      window.addEventListener('pointerleave', onPointerLeave, { passive: true });
      raf = requestAnimationFrame(draw);

      // ── LANDING CAPTURE ADAPTER CONTRACT ──
      const startBtn = document.getElementById('start-btn');
      const expand = document.getElementById('portal-expansion');

      function cleanupListeners() {
        if (raf) cancelAnimationFrame(raf);
        window.removeEventListener('resize', resize);
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerleave', onPointerLeave);
      }

      function launchExistingTradeShowCapture() {
        cleanupListeners();
        // Conceptual intent: vertical='TRADE_SHOW', source='landing', intent='create_virtual_booth'
        const targetUrl = '/?mode=booth-tour-wizard&step=1&source=landing&vertical=TRADE_SHOW&intent=create_virtual_booth';
        window.location.href = targetUrl;
      }

      function handleStartAction(e) {
        if (entered) return;
        entered = true;
        startBtn.style.pointerEvents = 'none';
        startBtn.classList.add('is-active');
        expand.classList.add('run');

        // Allow 720ms for smooth portal expansion before launching real capture
        setTimeout(() => {
          launchExistingTradeShowCapture();
        }, 720);
      }

      if (startBtn) startBtn.addEventListener('click', handleStartAction);
      if (startBtn) startBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          handleStartAction(e);
        }
      });

      // Export adapter status for automated testing / inspection
      window.__3D2R_LANDING_ADAPTER__ = {
        vertical: 'TRADE_SHOW',
        source: 'landing',
        intent: 'create_virtual_booth',
        isEntered: () => entered,
        cleanupListeners: cleanupListeners,
        launchCapture: launchExistingTradeShowCapture
      };
    })();
  

// ─── 3D2R ROUND 115 3-STAGE FLOW RUNTIME ADAPTER ────────────────────────────
window.triggerLandingRealtimeCapture = function() {
  if (typeof openMultiPointTourWizard === 'function' && window.setupWizard) {
    openMultiPointTourWizard(6);
    setTimeout(() => {
      if (window.setupWizard) {
        window.setupWizard.currentStep = 6;
        window.setupWizard.state.step = 6;
        window.setupWizard.state.currentStep = 6;
        window.setupWizard.renderStep();
        if (typeof window.setupWizard.startGuidedCapture === 'function') {
          window.setupWizard.startGuidedCapture();
        }
      }
    }, 150);
  } else {
    window.location.href = '/?mode=booth-tour-wizard&step=6&source=landing&vertical=TRADE_SHOW&intent=create_virtual_booth&autostart=1';
  }
};

window.triggerLandingUploadPhotos = function() {
  const form = document.getElementById('free-booth-form');
  if (form) {
    form.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const bizInput = document.getElementById('business-name-input');
    if (bizInput) bizInput.focus();
  } else {
    window.location.href = '/?source=landing&action=upload#free-booth-form';
  }
};

window.triggerLandingOpenViewer = function() {
  const studio = document.getElementById('freeStudioSection');
  if (studio && (studio.style.display !== 'none' || window.currentCandidateId)) {
    studio.style.display = 'block';
    studio.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } else {
    window.location.href = '/';
  }
};

window.triggerLandingBuyerIntent = function() {
  if (typeof openTrue3dQuoteModal === 'function') {
    openTrue3dQuoteModal();
  } else if (typeof openConsultationModal === 'function') {
    openConsultationModal();
  } else {
    window.location.href = '/?source=landing&action=rfq';
  }
};

function updateLandingFlowViewerState() {
  const viewerBtn = document.getElementById('btnLandingOpenViewer');
  const viewerIndicator = document.getElementById('flowNode2Indicator');
  const statusPill = document.getElementById('flowNode2Status');
  if (!viewerBtn) return;

  const studio = document.getElementById('freeStudioSection');
  const hasLiveStudio = studio && studio.style.display !== 'none';
  const hasCandidate = !!(window.currentCandidateId || (window.activeProjectData && window.activeProjectData.hasViewer));

  if (hasLiveStudio || hasCandidate) {
    viewerBtn.style.display = 'inline-flex';
    if (viewerIndicator) viewerIndicator.style.display = 'none';
    if (statusPill) {
      statusPill.textContent = 'READY TO VIEW';
      statusPill.className = 'node-status-pill conversion-pill';
    }
  } else {
    viewerBtn.style.display = 'none';
    if (viewerIndicator) viewerIndicator.style.display = 'inline-flex';
    if (statusPill) {
      statusPill.textContent = 'NEXT STATE';
      statusPill.className = 'node-status-pill downstream-pill';
    }
  }
}
setTimeout(updateLandingFlowViewerState, 500);
window.addEventListener('load', updateLandingFlowViewerState);

</script>
