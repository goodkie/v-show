#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 60px; z-index: 500;
  background: linear-gradient(180deg, rgba(3, 7, 18, 0.95) 0%, rgba(3, 7, 18, 0.7) 70%, transparent 100%);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 20px;
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.brand-group { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
  color: #fff; text-decoration: none; display: flex; align-items: center; gap: 6px;
}
.brand-logo span { color: var(--cyan); }
.brand-badge {
  font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
  color: var(--cyan); background: rgba(0, 194, 255, 0.12);
  border: 1px solid var(--panel-border); border-radius: 20px;
  padding: 4px 10px; display: flex; align-items: center; gap: 6px;
}
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan);
  animation: pulse-dot 1.8s infinite;
}
@keyframes pulse-dot { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.6; } }

.top-actions { display: flex; align-items: center; gap: 10px; }
.btn-ui {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px; color: rgba(255, 255, 255, 0.85);
  font-size: 12px; font-weight: 600; padding: 7px 14px;
  cursor: pointer; transition: var(--trans); text-decoration: none;
}
.btn-ui:hover {
  background: rgba(255, 255, 255, 0.15);
  border-color: rgba(255, 255, 255, 0.25); color: #fff;
}
.btn-ui.primary {
  background: #0284c7; border-color: #38bdf8; color: #fff;
  box-shadow: 0 0 16px rgba(2, 132, 199, 0.4);
}
.btn-ui.primary:hover { background: #0369a1; box-shadow: 0 0 20px rgba(56, 189, 248, 0.6); }

/* ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
   MATTERPORT VIEW MODE TOOLBAR (Bottom Center)
?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧 */
#mode-toolbar {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%);
  z-index: 500;
  display: flex; align-items: center; gap: 6px;
  background: rgba(8, 14, 26, 0.92);
  backdrop-filter: blur(20px);
  border: 1px solid var(--panel-border);
  border-radius: 40px; padding: 6px 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(0, 194, 255, 0.15);
}
.mode-btn {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 18px; border-radius: 30px;
  font-size: 12px; font-weight: 700; border: none;
  background: transparent; color: var(--text-muted);
  cursor: pointer; transition: var(--trans);
}
.mode-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
.mode-btn.active {
  background: var(--cyan); color: #030712;
  box-shadow: 0 0 14px var(--cyan-glow);
}
.toolbar-sep { width: 1px; height: 20px; background: rgba(255, 255, 255, 0.12); margin: 0 2px; }

/* ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
   MATTERPORT FLOOR RADAR / MINIMAP (Bottom Left)
?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧 */
#floor-radar-card {
  position: fixed; bottom: 24px; left: 24px;
  z-index: 500;
  width: 170px; height: 170px;
  background: rgba(8, 14, 26, 0.9);
  backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border);
  border-radius: 16px; padding: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  display: flex; flex-direction: column;
}
.radar-header {
  font-size: 10px; font-weight: 800; letter-spacing: 1px;

#radar-canvas {
  width: 100%; height: 100%; flex: 1;
  background: rgba(255, 255, 255, 0.02);
  border-radius: 8px; border: 1px dashed rgba(255, 255, 255, 0.1);
  cursor: pointer;
}

/* ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
   SPATIAL NODE LIST (Left Floating Sidebar)
?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧 */
#node-drawer {
  position: fixed; top: 80px; left: 24px;
  z-index: 450;
  display: flex; flex-direction: column; gap: 6px;
  background: rgba(8, 14, 26, 0.85);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 14px; padding: 10px;
  max-height: calc(100vh - 290px); overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
}
.node-btn {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 8px;
  background: transparent; border: 1px solid transparent;
  color: rgba(255, 255, 255, 0.7); font-size: 11.5px; font-weight: 600;
  cursor: pointer; transition: var(--trans); text-align: left;
  white-space: nowrap;
}
.node-btn:hover {
  background: rgba(255, 255, 255, 0.08); color: #fff;
}
.node-btn.active {
  background: rgba(0, 194, 255, 0.15);
  border-color: var(--panel-border); color: var(--cyan);
}
.node-icon { font-size: 14px; }

/* ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧
   3D MATTERTAGS (Floating Pins in Space)
?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧 */
.mattertag-element {
  position: absolute;
  transform: translate(-50%, -50%);
  pointer-events: all; cursor: pointer;
  z-index: 200;
}
.mattertag-beacon {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(0, 194, 255, 0.35);
  border: 2px solid var(--cyan);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 16px var(--cyan);
  transition: transform 0.2s ease, background 0.2s ease;
  animation: beacon-pulse 2.2s infinite;
}
@keyframes beacon-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(0, 194, 255, 0.7); }
  70%  { box-shadow: 0 0 0 16px rgba(0, 194, 255, 0); }
  100% { box-shadow: 0 0 0 0 rgba(0, 194, 255, 0); }
}
.mattertag-beacon::after {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: #ffffff;
}
.mattertag-element:hover .mattertag-beacon {
  transform: scale(1.25);
  background: rgba(0, 194, 255, 0.7);
}

.mattertag-card {
  position: absolute; bottom: 36px; left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: rgba(7, 12, 22, 0.95);
  backdrop-filter: blur(16px);
  border: 1px solid var(--cyan);
  border-radius: 12px; padding: 12px 16px;
  width: 220px; pointer-events: none;
  opacity: 0; transition: var(--trans);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 194, 255, 0.25);
}
.mattertag-element:hover .mattertag-card {
  opacity: 1; transform: translateX(-50%) translateY(0);
}
.tag-badge { font-size: 9px; font-weight: 800; color: var(--cyan); letter-spacing: 0.8px; text-transform: uppercase; }
.tag-title { font-size: 13px; font-weight: 700; color: #fff; margin: 2px 0 4px; }
.tag-desc  { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
.tag-cta   { font-size: 10px; font-weight: 700; color: var(--cyan); margin-top: 6px; display: flex; align-items: center; gap: 4px; }

/* ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧

#product-modal {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(3, 7, 18, 0.8); backdrop-filter: blur(20px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; pointer-events: none; transition: var(--trans);
}
#product-modal.open { opacity: 1; pointer-events: all; }
.modal-box {
  background: #0b1526; border: 1px solid var(--panel-border);
  border-radius: 20px; width: 100%; max-width: 600px;
  padding: 28px; position: relative;
  box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 30px rgba(0, 194, 255, 0.2);
  transform: scale(0.95); transition: var(--trans);
}
#product-modal.open .modal-box { transform: scale(1); }
.modal-close {
  position: absolute; top: 20px; right: 20px;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: none;
  color: #fff; font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: rgba(255,255,255,0.2); }
.spec-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
  margin: 18px 0;
}
.spec-item {
  background: rgba(255,255,255,0.04); border-radius: 8px; padding: 10px 14px;
}
.spec-k { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
.spec-v { font-size: 13px; font-weight: 700; color: #fff; margin-top: 2px; }

/* ?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧

?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧?먥븧 */
#toast {
  position: fixed; top: 76px; left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: rgba(8, 14, 26, 0.95);
  border: 1px solid var(--cyan); border-radius: 30px;
  padding: 8px 20px; font-size: 12px; font-weight: 600; color: #fff;
  z-index: 600; opacity: 0; pointer-events: none; transition: var(--trans);
  box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 15px var(--cyan-glow);
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

// ?? 2. MATTERTAG SPHERICAL COORDINATE HELPER ??
// Maps photo pixel positions (azimuth/elevation) onto sphere surface.
// az: horizontal angle (째) from centre-forward axis (+ = right, - = left)
// el: vertical angle (째) from top pole (90째 = horizon, >90째 = below horizon)
function sphPin(azDeg, elDeg) {
  const R = 70; // Slightly inside sphere radius 80
  const az = azDeg * Math.PI / 180;
  const el = elDeg * Math.PI / 180;
  return new THREE.Vector3(
    R * Math.sin(el) * Math.sin(az),   // X (right)
    R * Math.cos(el),                  // Y (up)
    R * Math.sin(el) * Math.cos(az)    // Z (forward)
  );
}

// ?? 4. THREE.JS SPATIAL SCENE INITIALIZATION ??

// ?? 5. FLOOR PUCKS ??
function buildFloorPucks() {
  SPATIAL_NODES.forEach((node, idx) => {
    const puckGroup = new THREE.Group();
    // Map node positions to visible floor-like positions in panorama
    const px = (idx - 2.5) * 14;
    puckGroup.position.set(px, -22, 40);

    const ringGeo = new THREE.RingGeometry(4.5, 6.5, 36);
    const ringMat = new THREE.MeshBasicMaterial({ color: 0x00c2ff, side: THREE.DoubleSide, transparent: true, opacity: 0.85 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI * 0.5;
    puckGroup.add(ring);

    const diskGeo = new THREE.CircleGeometry(3.5, 32);
    const diskMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 });
    const disk = new THREE.Mesh(diskGeo, diskMat);
    disk.rotation.x = -Math.PI * 0.5;
    disk.position.y = 0.01;
    puckGroup.add(disk);

    puckGroup.userData.nodeIdx = idx;
    puckGroup.traverse(child => {
      if (child.isMesh) child.userData.nodeIdx = idx;
    });
    scene.add(puckGroup);
    floorPucks.push(puckGroup);
  });

  // Raycaster for puck clicks
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  document.getElementById('three-canvas').addEventListener('click', (e) => {
    const rect = renderer.domElement.getBoundingClientRect();
    mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
    mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const hits = raycaster.intersectObjects(floorPucks.flatMap(g => g.children));
    if (hits.length > 0) {
      const ni = hits[0].object.userData.nodeIdx;
      if (ni !== undefined) switchNode(ni);
    }
  });
}

// ?? 8. TEXTURE LOADING ??Maximum Quality ??
function loadNodeTexture(url, callback) {
  if (textureCache[url]) { callback(textureCache[url]); return; }
  textureLoader.load(url, (tex) => {
    tex.encoding = THREE.sRGBEncoding;
    tex.minFilter = THREE.LinearMipMapLinearFilter; // Trilinear ??sharpest
    tex.magFilter = THREE.LinearFilter;
    tex.generateMipmaps = true;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.wrapS = THREE.RepeatWrapping;
    tex.repeat.x = -1; // Mirror-correct equirectangular orientation
    tex.needsUpdate = true;
    textureCache[url] = tex;
    callback(tex);
  });
}

// ?? 9. SWITCH NODE ??Photo Swap + Camera Orient ??
function switchNode(idx) {
  currentNodeIdx = idx;
  const node = SPATIAL_NODES[idx];

  document.querySelectorAll('.node-btn').forEach((b, i) => b.classList.toggle('active', i === idx));
  document.getElementById('radar-loc-txt').textContent = node.name.toUpperCase();

  // Apply photo to sphere
  loadNodeTexture(node.image, (tex) => {
    photoMaterial.map = tex;
    photoMaterial.needsUpdate = true;
  });

  // Orient camera toward the primary view direction of this node
  if (currentMode === 'tour') {
    new TWEEN.Tween(controls.target)
      .to({ x: node.camLook.x, y: node.camLook.y, z: node.camLook.z }, 900)
      .easing(TWEEN.Easing.Cubic.Out)
      .start();
  }

  floorPucks.forEach((puck, i) => {
    const isCurrent = (i === idx);
    puck.children[0].material.opacity = isCurrent ? 0.25 : 0.85;
    puck.children[1].material.opacity = isCurrent ? 0.35 : 0.9;

  drawRadar();
  showToast(`?뱧 ${node.name} ?ㅼ궗 怨듦컙?쇰줈 ?대룞?덉뒿?덈떎.`);
}

// ?? 12. RADAR MINIMAP ??
function drawRadar() {
  const cvs = document.getElementById('radar-canvas');
  if (!cvs) return;
  const ctx = cvs.getContext('2d');
  ctx.clearRect(0, 0, cvs.width, cvs.height);
  ctx.strokeStyle = '#00c2ff'; ctx.lineWidth = 1.5;
  ctx.strokeRect(16, 12, 114, 92);
  ctx.fillStyle = '#ffffff';
  [[16,12],[130,12],[16,104],[130,104]].forEach(([x,y]) => ctx.fillRect(x-2, y-2, 5, 5));
  SPATIAL_NODES.forEach((n, idx) => {
    const isCur = (idx === currentNodeIdx);
    ctx.beginPath();
    ctx.arc(n.radarPos.x, n.radarPos.y, isCur ? 6 : 3.5, 0, Math.PI*2);
    ctx.fillStyle = isCur ? '#00c2ff' : 'rgba(255,255,255,0.4)';
    ctx.fill();
    if (isCur) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke(); }
  });
  const cur = SPATIAL_NODES[currentNodeIdx];
  const angle = Math.atan2(controls.target.x - camera.position.x, controls.target.z - camera.position.z);
  ctx.fillStyle = 'rgba(0, 194, 255, 0.2)';
  ctx.beginPath();
  ctx.moveTo(cur.radarPos.x, cur.radarPos.y);
  ctx.arc(cur.radarPos.x, cur.radarPos.y, 24, angle - 0.4, angle + 0.4);
  ctx.closePath();
  ctx.fill();
}

function updateMattertags() {
  MATTERTAGS.forEach(tag => {
    if (!tag.domElement) return;
    const wp = tag.worldPos.clone();
    wp.project(camera);
    if (wp.z > 1.0) { tag.domElement.style.display = 'none'; return; }
    tag.domElement.style.display = currentMode === 'tour' ? 'block' : 'none';
    const sx = (wp.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (-(wp.y * 0.5) + 0.5) * window.innerHeight;
    tag.domElement.style.left = sx + 'px';
    tag.domElement.style.top  = sy + 'px';
  });
}
