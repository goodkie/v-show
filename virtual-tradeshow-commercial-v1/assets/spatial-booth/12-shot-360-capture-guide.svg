<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="boothGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.35)"/>
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.03)"/>
    </linearGradient>
    <linearGradient id="coneActiveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(34, 197, 94, 0.45)"/>
      <stop offset="100%" stop-color="rgba(34, 197, 94, 0.05)"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Grid Floor Pattern -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="80" y1="60" x2="720" y2="60" stroke-dasharray="4,4"/>
    <line x1="80" y1="140" x2="720" y2="140" stroke-dasharray="4,4"/>
    <line x1="80" y1="220" x2="720" y2="220" stroke-dasharray="4,4"/>
    <line x1="80" y1="300" x2="720" y2="300" stroke-dasharray="4,4"/>
    <line x1="80" y1="380" x2="720" y2="380" stroke-dasharray="4,4"/>
    <line x1="160" y1="40" x2="160" y2="440" stroke-dasharray="4,4"/>
    <line x1="280" y1="40" x2="280" y2="440" stroke-dasharray="4,4"/>
    <line x1="400" y1="40" x2="400" y2="440" stroke-dasharray="4,4"/>
    <line x1="520" y1="40" x2="520" y2="440" stroke-dasharray="4,4"/>
    <line x1="640" y1="40" x2="640" y2="440" stroke-dasharray="4,4"/>
  </g>

  <!-- Booth Perimeter Walls -->
  <rect x="110" y="60" width="580" height="360" rx="12" fill="url(#boothGrad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2"/>
  
  <!-- Boundary Labels -->
  <text x="400" y="84" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2">▲ BACK WALL / EXHIBITS</text>
  <text x="400" y="408" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2">▼ BOOTH FRONT / ENTRANCE</text>
  <text x="132" y="245" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2" transform="rotate(-90 132 245)">◀ LEFT SIDE</text>
  <text x="668" y="245" text-anchor="middle" fill="#64748b" font-family="Inter, sans-serif" font-size="11" font-weight="700" letter-spacing="2" transform="rotate(90 668 245)">RIGHT SIDE ▶</text>

  <!-- Title Pill -->
  <g transform="translate(260, 18)">
    <rect x="0" y="0" width="280" height="30" rx="15" fill="rgba(14, 165, 233, 0.18)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="140" y="19" text-anchor="middle" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="800" letter-spacing="1">YOUR 12-SHOT 360 CAPTURE</text>
  </g>

  <!-- Rays Group -->
  <g id="rays-group">
    <!-- Ray 1 (0 deg) -->
    <path d="M 400 240 L 370.4 87.8 A 155 155 0 0 1 429.6 87.8 Z" fill="url(#coneActiveGrad)" stroke="#22c55e" stroke-width="1" opacity="0.75"/>
    <circle cx="400.0" cy="85.0" r="3" fill="#22c55e"/>
    <rect x="386.0" y="50.0" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#22c55e" stroke-width="1.2"/>
    <text x="400.0" y="63.0" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">01</text>
    <!-- Ray 2 (30 deg) -->
    <path d="M 400 240 L 450.5 93.4 A 155 155 0 0 1 501.7 123.0 Z" fill="url(#coneGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
    <circle cx="477.5" cy="105.8" r="3" fill="#38bdf8"/>
    <rect x="476.5" y="74.2" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="490.5" y="87.2" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">02</text>
    <!-- Ray 3 (60 deg) -->
    <path d="M 400 240 L 517.0 138.3 A 155 155 0 0 1 546.6 189.5 Z" fill="url(#coneGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
    <circle cx="534.2" cy="162.5" r="3" fill="#38bdf8"/>
    <rect x="542.8" y="140.5" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="556.8" y="153.5" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">03</text>
    <!-- Ray 4 (90 deg) -->
    <path d="M 400 240 L 552.2 210.4 A 155 155 0 0 1 552.2 269.6 Z" fill="url(#coneGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
    <circle cx="555.0" cy="240.0" r="3" fill="#38bdf8"/>
    <rect x="567.0" y="231.0" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="581.0" y="244.0" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">04</text>
    <!-- Ray 5 (120 deg) -->
    <path d="M 400 240 L 546.6 290.5 A 155 155 0 0 1 517.0 341.7 Z" fill="url(#coneGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
    <circle cx="534.2" cy="317.5" r="3" fill="#38bdf8"/>
    <rect x="542.8" y="321.5" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="556.8" y="334.5" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">05</text>
    <!-- Ray 6 (150 deg) -->
    <path d="M 400 240 L 501.7 357.0 A 155 155 0 0 1 450.5 386.6 Z" fill="url(#coneGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
    <circle cx="477.5" cy="374.2" r="3" fill="#38bdf8"/>
    <rect x="476.5" y="387.8" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="490.5" y="400.8" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">06</text>
    <!-- Ray 7 (180 deg) -->
    <path d="M 400 240 L 429.6 392.2 A 155 155 0 0 1 370.4 392.2 Z" fill="url(#coneGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
    <circle cx="400.0" cy="395.0" r="3" fill="#38bdf8"/>
    <rect x="386.0" y="412.0" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="400.0" y="425.0" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">07</text>
    <!-- Ray 8 (210 deg) -->
    <path d="M 400 240 L 349.5 386.6 A 155 155 0 0 1 298.3 357.0 Z" fill="url(#coneGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
    <circle cx="322.5" cy="374.2" r="3" fill="#38bdf8"/>
    <rect x="295.5" y="387.8" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="309.5" y="400.8" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">08</text>
    <!-- Ray 9 (240 deg) -->
    <path d="M 400 240 L 283.0 341.7 A 155 155 0 0 1 253.4 290.5 Z" fill="url(#coneGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
    <circle cx="265.8" cy="317.5" r="3" fill="#38bdf8"/>
    <rect x="229.2" y="321.5" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="243.2" y="334.5" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">09</text>
    <!-- Ray 10 (270 deg) -->
    <path d="M 400 240 L 247.8 269.6 A 155 155 0 0 1 247.8 210.4 Z" fill="url(#coneGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
    <circle cx="245.0" cy="240.0" r="3" fill="#38bdf8"/>
    <rect x="205.0" y="231.0" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="219.0" y="244.0" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">10</text>
    <!-- Ray 11 (300 deg) -->
    <path d="M 400 240 L 253.4 189.5 A 155 155 0 0 1 283.0 138.3 Z" fill="url(#coneGrad)" stroke="#38bdf8" stroke-width="1" opacity="0.75"/>
    <circle cx="265.8" cy="162.5" r="3" fill="#38bdf8"/>
    <rect x="229.2" y="140.5" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="243.2" y="153.5" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">11</text>
    <!-- Ray 12 (330 deg) -->
    <path d="M 400 240 L 298.3 123.0 A 155 155 0 0 1 349.5 93.4 Z" fill="url(#coneGrad)" stroke="#f59e0b" stroke-width="1" opacity="0.75"/>
    <circle cx="322.5" cy="105.8" r="3" fill="#f59e0b"/>
    <rect x="295.5" y="74.2" width="28" height="18" rx="4" fill="rgba(15, 23, 42, 0.9)" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="309.5" y="87.2" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="800">12</text>
  </g>

  <!-- 360 Rotation Circular Track -->
  <circle cx="400" cy="240" r="85" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.6"/>
  <circle cx="400" cy="240" r="52" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="8,4" opacity="0.8"/>

  <!-- Circular Rotation Arrow around Photographer -->
  <path d="M 360 215 A 50 50 0 1 1 350 245" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <polygon points="344,242 354,258 358,238" fill="#22c55e"/>

  <!-- Photographer & Fixed Footprints -->
  <g transform="translate(400, 240)">
    <!-- Spot Circle Anchor -->
    <circle cx="0" cy="0" r="28" fill="rgba(2, 132, 199, 0.25)" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3"/>
    
    <!-- Fixed Footprints (Stationary) -->
    <!-- Left foot -->
    <g transform="translate(-8, -4)">
      <ellipse cx="0" cy="0" rx="4.5" ry="9" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>
      <ellipse cx="0" cy="6" rx="3.5" ry="4" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>
    </g>
    <!-- Right foot -->
    <g transform="translate(8, -4)">
      <ellipse cx="0" cy="0" rx="4.5" ry="9" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>
      <ellipse cx="0" cy="6" rx="3.5" ry="4" fill="#94a3b8" stroke="#0f172a" stroke-width="1"/>
    </g>

    <!-- Person Icon / Camera -->
    <circle cx="0" cy="-1" r="11" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="0" cy="-1" r="5" fill="#ffffff"/>
    
    <!-- Camera Direction Ray -->
    <line x1="0" y1="-1" x2="0" y2="-22" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <polygon points="-4,-22 4,-22 0,-28" fill="#22c55e"/>
  </g>

  <!-- Banner Badges -->
  <g transform="translate(325, 125)">
    <rect x="0" y="0" width="150" height="22" rx="11" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="1"/>
    <text x="75" y="15" text-anchor="middle" fill="#4ade80" font-family="Inter, sans-serif" font-size="10.5" font-weight="800">START: SHOT 01 (0°)</text>
  </g>
  <g transform="translate(320, 335)">
    <rect x="0" y="0" width="160" height="22" rx="11" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1"/>
    <text x="80" y="15" text-anchor="middle" fill="#fbbf24" font-family="Inter, sans-serif" font-size="10.5" font-weight="800">CLOSE: SHOT 12 ↔ 01</text>
  </g>

  <!-- Legend / Highlights -->
  <g transform="translate(130, 435)">
    <circle cx="6" cy="6" r="5" fill="#22c55e"/>
    <text x="18" y="10" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11" font-weight="600">Fixed Center Position</text>
    
    <circle cx="180" cy="6" r="5" fill="#38bdf8"/>
    <text x="192" y="10" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11" font-weight="600">Rotate ~30° Per Shot</text>

    <circle cx="355" cy="6" r="5" fill="#f59e0b"/>
    <text x="367" y="10" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11" font-weight="600">~50% Overlap Between Shots</text>

    <circle cx="560" cy="6" r="5" fill="#a855f7"/>
    <text x="572" y="10" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="11" font-weight="600">Shot 12 Overlaps Shot 01</text>
  </g>
</svg>