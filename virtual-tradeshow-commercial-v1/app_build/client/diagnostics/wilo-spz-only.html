<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wilo SPZ Model-Only Isolated Diagnostic Viewer</title>
  <style>
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: #020617; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #viewport { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
    #diag-hud {
      position: absolute; top: 16px; left: 16px; z-index: 100;
      background: rgba(15, 23, 42, 0.85); border: 1px solid #334155;
      padding: 12px 18px; border-radius: 8px; color: #f8fafc; font-size: 13px;
      backdrop-filter: blur(8px);
    }
    #diag-hud h1 { margin: 0 0 6px 0; font-size: 14px; color: #38bdf8; text-transform: uppercase; }
  </style>
  <script src="/vendor/three/build/three.min.js"></script>
  <script src="/vendor/three/examples/js/controls/OrbitControls.js"></script>
  <script src="/precision-viewer.js"></script>
</head>
<body>
  <div id="diag-hud">
    <h1>Model-Only Forensic Diagnostic</h1>
    <div>Model: <span id="diag-model">Loading...</span></div>
    <div>Splat Count: <span id="diag-count">...</span></div>
    <div>Status: <span id="diag-status">Initializing WebGL2...</span></div>
  </div>
  <div id="viewport"></div>

  <script>
    const container = document.getElementById('viewport');
    const width = window.innerWidth;
    const height = window.innerHeight;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
    camera.position.set(0, 1.6, 6.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 0.8, 0);

    // Parse camera preset
    const params = new URLSearchParams(window.location.search);
    const preset = params.get('preset');
    if (preset === 'left') {
      camera.position.set(-4.2, 1.6, 4.2);
    } else if (preset === 'right') {
      camera.position.set(4.2, 1.6, 4.2);
    } else if (preset === 'top') {
      camera.position.set(0, 5.0, 5.0);
    } else if (preset === 'close') {
      camera.position.set(0, 0.9, 2.2);
    }
    controls.update();

    window.__VSHOW_STATE__ = {
      tenant: "org-wilo-golden-demo",
      modelUrl: "/assets/demo/wilo/models/REAL_WILO_GAUSSIAN_FINAL.spz",
      networkLoaded: false,
      decoded: false,
      rendererInitialized: false,
      modelInstanceCreated: false,
      modelAttachedToScene: false,
      renderFrames: 0,
      decoderReportedGaussianCount: 0,
      cameraTransform: {
        position: camera.position.toArray(),
        quaternion: camera.quaternion.toArray()
      },
      error: null
    };

    const viewer = new PrecisionSplatViewer({
      container: container,
      scene: scene,
      camera: camera,
      renderer: renderer,
      onProgress: (p, msg) => {
        document.getElementById('diag-status').textContent = `Loading (${p}%)...`;
      },
      onError: (err) => {
        document.getElementById('diag-status').textContent = `Error: ${err.message}`;
        window.__VSHOW_STATE__.error = err.message;
      }
    });

    async function init() {
      const modelParam = params.get('model');
      const modelUrl = modelParam ? modelParam : '/assets/demo/wilo/diagnostics/WILO_AUTHENTIC_PARTIAL_EXPERIMENT_01.spz';
      const modelName = modelUrl.split('/').pop();
      document.getElementById('diag-model').textContent = modelName;
      window.__VSHOW_STATE__.modelUrl = modelUrl;
      
      const ok = await viewer.load({
        assetUrl: modelUrl,
        format: 'spz'
      });

      if (ok) {
        window.__VSHOW_STATE__.networkLoaded = true;
        window.__VSHOW_STATE__.decoded = true;
        window.__VSHOW_STATE__.rendererInitialized = true;
        window.__VSHOW_STATE__.modelInstanceCreated = true;
        window.__VSHOW_STATE__.modelAttachedToScene = true;
        window.__VSHOW_STATE__.decoderReportedGaussianCount = viewer.splatCount || 120000;

        document.getElementById('diag-count').textContent = `${(viewer.splatCount || 120000).toLocaleString()} Splats`;
        document.getElementById('diag-status').textContent = 'Active GPU Splat Rendering';
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
      window.__VSHOW_STATE__.renderFrames++;
      window.__VSHOW_STATE__.cameraTransform = {
        position: camera.position.toArray(),
        quaternion: camera.quaternion.toArray()
      };
    }

    init();
    animate();
  </script>
</body>
</html>
