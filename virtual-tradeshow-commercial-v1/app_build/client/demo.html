<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>dn’a — 3D Commercial Virtual Booth Demo</title>
  <meta name="description" content="Immersive 3D virtual trade show commercial demo with interactive products, digital catalogs, Smart Exhibitor Card, and real-time RFQ intake.">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0284c7;
      --primary-light: #38bdf8;
      --accent: #6366f1;
      --dark: #070e17;
      --panel-bg: rgba(10, 20, 32, 0.92);
      --border: rgba(255, 255, 255, 0.14);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--dark);
      color: #fff;
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    }
    button, input, select, textarea { font-family: inherit; }
    .app { position: relative; width: 100%; height: 100dvh; }
    .stage { position: absolute; inset: 0; width: 100%; height: 100%; }

    /* Top Bar */
    .top-bar {
      position: absolute;
      z-index: 30;
      top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(7, 14, 23, 0.95), rgba(7, 14, 23, 0.4), transparent);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .brand-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: -0.5px;
      text-decoration: none;
    }
    .badge-demo {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border: 1px solid #0284c7;
      border-radius: 20px;
      padding: 4px 9px;
      background: rgba(2, 132, 199, 0.2);
      color: #7dd3fc;
      text-transform: uppercase;
    }
    .top-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-top {
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.8);
      color: #f8fafc;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-top:hover { background: #1e293b; border-color: #38bdf8; }
    .btn-top.primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-color: #0284c7;
      color: #fff;
    }

    /* Left Side Rail Navigation */
    .rail-nav {
      position: absolute;
      z-index: 25;
      left: 16px;
      top: 85px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .rail-btn {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }
    .rail-btn:hover {
      background: #0284c7;
      border-color: #38bdf8;
      transform: translateX(2px);
    }

    /* Bottom HUD */
    .hud-bar {
      position: absolute;
      z-index: 25;
      bottom: calc(16px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      align-items: center;
      background: rgba(10, 20, 32, 0.88);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 6px 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .hud-btn {
      border: none;
      background: transparent;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-btn:hover, .hud-btn.active {
      background: rgba(14, 165, 233, 0.2);
      color: #38bdf8;
    }

    /* Floating Notice Overlay */
    .notice-box {
      position: absolute;
      z-index: 20;
      left: 76px;
      bottom: 85px;
      max-width: 320px;
      background: rgba(10, 20, 32, 0.9);
      border: 1px solid var(--border);
      padding: 14px 16px;
      border-radius: 12px;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.5;
      backdrop-filter: blur(12px);
    }
    .notice-box b { color: #f8fafc; font-size: 13px; }

    /* Side Drawer / Modal System */
    .drawer {
      position: absolute;
      z-index: 40;
      right: 0;
      top: 0;
      height: 100%;
      width: min(480px, 94vw);
      background: var(--panel-bg);
      border-left: 1px solid var(--border);
      backdrop-filter: blur(20px);
      transform: translateX(105%);
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 75px 24px 30px;
      overflow-y: auto;
      box-shadow: -15px 0 40px rgba(0,0,0,0.7);
    }
    .drawer.open { transform: none; }
    .drawer-close {
      position: absolute;
      right: 18px;
      top: 18px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .drawer-close:hover { background: rgba(239,68,68,0.8); }

    /* UI Cards and Controls inside Drawer */
    .drawer-title { font-size: 22px; font-weight: 800; margin: 0 0 6px 0; color: #fff; }
    .drawer-subtitle { color: #94a3b8; font-size: 13px; line-height: 1.5; margin: 0 0 20px 0; }
    .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
    .info-card {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: rgba(255,255,255,0.03);
      cursor: pointer;
      transition: all 0.2s;
    }
    .info-card:hover {
      border-color: #38bdf8;
      background: rgba(14, 165, 233, 0.08);
      transform: translateY(-2px);
    }
    .info-card b { display: block; font-size: 13px; color: #f8fafc; margin-bottom: 4px; }
    .info-card small { color: #94a3b8; font-size: 11px; }

    /* Product 3D Hero Preview Container inside Drawer */
    .product-3d-box {
      height: 220px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: radial-gradient(circle, #0c2333, #070e17);
      margin: 16px 0;
      position: relative;
      overflow: hidden;
    }

    /* Form Fields */
    .form-field {
      width: 100%;
      margin: 8px 0 14px 0;
      padding: 11px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #0d1b2a;
      color: #fff;
      font-size: 13px;
    }
    .form-field:focus { outline: none; border-color: #38bdf8; }
    .btn-action {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 6px;
    }
    .btn-action:hover { opacity: 0.92; transform: translateY(-1px); }
    .btn-secondary {
      width: 100%;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border);
      color: #f8fafc;
      padding: 11px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: #1e293b; border-color: #38bdf8; }

    .result-banner {
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      color: #34d399;
      font-size: 12px;
      line-height: 1.5;
    }
    .disclaimer-box {
      font-size: 11px;
      color: #64748b;
      margin-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      padding-top: 12px;
    }

    @media (max-width: 768px) {
      .top-bar { padding: 10px 14px; }
      .badge-demo { display: none; }
      .notice-box { display: none; }
      .rail-nav { left: 10px; top: 70px; }
      .hud-bar { width: calc(100% - 24px); justify-content: space-around; font-size: 11px; }
      .hud-btn { padding: 6px 8px; font-size: 11px; }
      .drawer { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 3D Canvas Stage -->
    <div id="stage" class="stage"></div>

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand-group">
        <a href="/" class="brand-title">dn’a</a>
        <span class="badge-demo">DESIGNED_3D SHOWROOM DEMO</span>
      </div>
      <div class="top-actions">
        <button class="btn-top" onclick="openPanel('catalog')">▤ Catalog</button>
        <button class="btn-top" onclick="openPanel('card')">📱 Smart Card</button>
        <button class="btn-top primary" onclick="openPanel('rfq')">Request RFQ</button>
      </div>
    </header>

    <!-- Left Rail -->
    <nav class="rail-nav">
      <button class="rail-btn" title="3D Products" onclick="openPanel('products')">◈</button>
      <button class="rail-btn" title="Digital Catalog" onclick="openPanel('catalog')">▤</button>
      <button class="rail-btn" title="Smart Exhibitor Card" onclick="openPanel('card')">📱</button>
      <button class="rail-btn" title="Live Expert Booking" onclick="openPanel('meeting')">📅</button>
      <button class="rail-btn" title="Request Sample" onclick="openPanel('sample')">📦</button>
    </nav>

    <!-- Informational Notice -->
    <div class="notice-box">
      <b>Interactive 3D Showroom Demo</b><br>
      Click glowing product rings to inspect 3D models, download datasheets, and test live wholesale RFQ intake.
    </div>

    <!-- Bottom HUD Navigation -->
    <div class="hud-bar">
      <button class="hud-btn" onclick="resetCamera()">⌂ Home View</button>
      <button class="hud-btn" onclick="focusZone('products')">◉ Products Zone</button>
      <button class="hud-btn" onclick="focusZone('meeting')">◎ Meeting Lounge</button>
      <button class="hud-btn" onclick="toggleAutoTour()">↻ Auto Tour</button>
      <button class="hud-btn" onclick="openPanel('briefcase')">▣ Briefcase (<span id="briefcase-count">0</span>)</button>
      <button class="hud-btn" onclick="openPanel('analytics')">📊 Analytics</button>
    </div>

    <!-- Side Panel Drawer -->
    <aside id="drawer" class="drawer">
      <button class="drawer-close" onclick="closePanel()">✕</button>
      <div id="drawer-content"></div>
    </aside>
  </div>

  <script>
    // ── 1. Canonical Products Dataset (8 Sample B2B Automation Products) ──
    const PRODUCTS = [
      {
        id: 'DNA-ROBOT-X9',
        name: 'dn’a Apex-Arm X9 Cobot',
        type: 'Collaborative Robot',
        moq: '1 Unit',
        price: '$24,500 – $28,900 USD',
        reach: '1,350 mm',
        payload: '16 kg',
        desc: '6-axis precision collaborative robot with integrated torque feedback sensors and zero-code lead-through teaching.',
        color: 0x0284c7
      },
      {
        id: 'DNA-AGV-500',
        name: 'dn’a Nav-AGV 500 Transport',
        type: 'Autonomous Mobile Robot',
        moq: '2 Units',
        price: '$32,000 – $36,500 USD',
        reach: '1.8 m/s SLAM',
        payload: '500 kg',
        desc: 'Heavy-duty autonomous mobile logistics robot utilizing SLAM LiDAR navigation for pallet intralogistics.',
        color: 0x6366f1
      },
      {
        id: 'DNA-VISION-3D',
        name: 'dn’a Vision-Sense 3D Scanner',
        type: 'Industrial Metrology',
        moq: '1 Unit',
        price: '$18,900 – $22,000 USD',
        reach: '120 fps Blue LED',
        payload: '±5 μm Accuracy',
        desc: 'Ultra-high-speed structured light 3D surface scanner engineered for 100% in-line quality inspection.',
        color: 0x10b981
      },
      {
        id: 'DNA-GRIPPER-H40',
        name: 'dn’a Smart-Gripper H40',
        type: 'Robotic End-Effector',
        moq: '4 Units',
        price: '$3,200 – $4,100 USD',
        reach: '60 mm Stroke',
        payload: '140 N Force',
        desc: 'Servo-electric 2-finger adaptive gripper with programmable force control and vacuum integration.',
        color: 0xf59e0b
      },
      {
        id: 'DNA-FLOW-PRO',
        name: 'dn’a Flow-Control Pro Module',
        type: 'Fluidic Automation',
        moq: '1 Unit',
        price: '$14,800 – $19,200 USD',
        reach: '220 m³/h Flow',
        payload: 'IE5 Ultra-Premium',
        desc: 'Intelligent fluid circulation and pressure management station equipped with variable frequency drive.',
        color: 0x06b6d4
      },
      {
        id: 'DNA-INVERTER-S',
        name: 'dn’a Synchro-Drive Inverter',
        type: 'Power Electronics',
        moq: '5 Units',
        price: '$1,450 – $2,300 USD',
        reach: 'EtherCAT / PROFINET',
        payload: '98.7% Efficiency',
        desc: 'High-efficiency variable frequency motor drive optimized for high-dynamic robotics and packaging.',
        color: 0x8b5cf6
      },
      {
        id: 'DNA-EDGE-GATEWAY',
        name: 'dn’a Edge-Core IoT Gateway',
        type: 'Industrial Computing',
        moq: '2 Units',
        price: '$2,100 – $2,800 USD',
        reach: '26 TOPS NPU',
        payload: '4x GbE / CAN-FD',
        desc: 'Fanless DIN-rail industrial computer designed for high-speed edge AI processing and cloud bridging.',
        color: 0xec4899
      },
      {
        id: 'DNA-WELD-CELL',
        name: 'dn’a Laser-Weld Pro Cell',
        type: 'Turnkey Workcell',
        moq: '1 Unit',
        price: '$115,000 – $145,000 USD',
        reach: '3,000 W Fiber',
        payload: 'Dual Rotary Station',
        desc: 'Fully enclosed robotic fiber laser welding cell with Class 1 laser safety interlocks and seam tracking.',
        color: 0xef4444
      }
    ];

    let scene, camera, renderer, controls, autoTour = false;
    let raycaster = new THREE.Raycaster(), mouse = new THREE.Vector2();
    let hotspotMeshes = [], briefcaseItems = [];

    // ── 2. Initialize Three.js 3D Booth ──
    function initBooth() {
      const host = document.getElementById('stage');
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070e17);
      scene.fog = new THREE.Fog(0x070e17, 18, 38);

      camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 100);
      camera.position.set(9, 5.2, 11);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      host.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.target.set(0, 1.5, 0);
      controls.minDistance = 3.5;
      controls.maxDistance = 20;
      controls.maxPolarAngle = Math.PI / 2.05;

      // Lights
      scene.add(new THREE.HemisphereLight(0xffffff, 0x111e2e, 1.3));
      const sun = new THREE.DirectionalLight(0xffffff, 1.2);
      sun.position.set(6, 12, 8);
      sun.castShadow = true;
      scene.add(sun);

      buildBoothGeometry();

      renderer.domElement.addEventListener('pointerdown', handleSceneClick);
      window.addEventListener('resize', handleResize);
      animateLoop();
    }

    function createMat(color, metal = 0.1, rough = 0.4) {
      return new THREE.MeshStandardMaterial({ color, metalness: metal, roughness: rough });
    }

    function createBox(w, h, d, color, x, y, z) {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), createMat(color));
      mesh.position.set(x, y, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function buildBoothGeometry() {
      const white = 0xf1f5f9, teal = 0x0284c7, dark = 0x0f172a;

      // Floor & Wall Partitions
      createBox(15, 0.15, 10, 0x1e293b, 0, 0, 0);
      createBox(14, 4.2, 0.2, white, 0, 2.1, -4.8);
      createBox(0.2, 4.2, 7.5, white, -7.0, 2.1, -1.0);

      // Top Canopy / Architectural Brand Fascia
      createBox(7.2, 0.3, 1.8, white, 0, 4.6, -3.8);
      createBox(6.8, 0.12, 1.5, teal, 0, 4.45, -3.75);

      // Digital Media Screen on Back Wall
      createBox(4.2, 2.2, 0.08, 0x082f49, -3.8, 2.4, -4.68);
      createBox(4.0, 2.0, 0.06, 0x0284c7, -3.8, 2.4, -4.62);

      // Front Reception Desk
      createBox(3.4, 0.9, 0.9, white, -4.2, 0.45, 2.2);
      createBox(3.2, 0.75, 0.85, teal, -4.2, 0.5, 2.22);

      // Meeting Lounge Table & Chairs
      const table = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 0.08, 32), createMat(white));
      table.position.set(4.5, 0.8, 2.2);
      scene.add(table);
      for (let i = 0; i < 4; i++) {
        const ang = (i * Math.PI) / 2;
        createBox(0.55, 0.55, 0.55, dark, 4.5 + Math.cos(ang) * 1.5, 0.28, 2.2 + Math.sin(ang) * 1.5);
      }

      // Brand Signage
      createSign('dn’a Robotics', 0, 3.2, -4.68, 5.0, 1.0, '#0ea5e9');
      createSign('Next-Generation Intelligent Automation', 0, 2.6, -4.67, 4.8, 0.5, '#64748b');

      // 8 Product Plinths and Interactive Hologram Rings
      const plinthPositions = [
        { x: -5.2, z: -2.8 }, { x: -2.6, z: -2.8 }, { x: 0.0, z: -2.8 }, { x: 2.6, z: -2.8 },
        { x: -3.8, z: -0.6 }, { x: -1.2, z: -0.6 }, { x: 1.4, z: -0.6 }, { x: 4.0, z: -0.6 }
      ];

      PRODUCTS.forEach((p, idx) => {
        const pos = plinthPositions[idx];
        createBox(1.1, 0.2, 1.1, white, pos.x, 0.1, pos.z);

        // Product procedural proxy model
        const group = new THREE.Group();
        const base = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.35, 0.75, 24), createMat(p.color, 0.3, 0.3));
        base.position.y = 0.65;
        group.add(base);

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.48, 0.48, 0.42), createMat(dark, 0.4, 0.2));
        head.position.y = 1.15;
        group.add(head);

        group.position.set(pos.x, 0.1, pos.z);
        group.userData.product = p;
        scene.add(group);

        // Glowing Hotspot Ring
        const ringGeo = new THREE.TorusGeometry(0.44, 0.035, 12, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.set(pos.x, 1.6, pos.z);
        ring.userData.product = p;
        scene.add(ring);
        hotspotMeshes.push(ring);
      });
    }

    function createSign(text, x, y, z, w, h, textColor = '#0284c7') {
      const c = document.createElement('canvas');
      c.width = 1024; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = textColor;
      ctx.font = '800 68px Arial, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, 512, 140);
      const texture = new THREE.CanvasTexture(c);
      const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      plane.position.set(x, y, z);
      scene.add(plane);
    }

    function handleSceneClick(e) {
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObjects(scene.children, true);
      const hit = intersects.find(h => {
        let obj = h.object;
        while (obj) {
          if (obj.userData && obj.userData.product) return true;
          obj = obj.parent;
        }
        return false;
      });

      if (hit) {
        let obj = hit.object;
        while (obj && !obj.userData.product) obj = obj.parent;
        if (obj && obj.userData.product) {
          openPanel('product', obj.userData.product);
        }
      }
    }

    // ── 3. Panel & Drawer Drawer Controllers ──
    function openPanel(type, data = null) {
      const drawer = document.getElementById('drawer');
      const content = document.getElementById('drawer-content');
      drawer.classList.add('open');

      if (type === 'products') {
        content.innerHTML = `
          <h2 class="drawer-title">3D Products Gallery</h2>
          <p class="drawer-subtitle">Select any commercial product to inspect engineering specifications, request wholesale pricing, or book an engineer.</p>
          <div class="card-grid">
            ${PRODUCTS.map(p => `
              <div class="info-card" onclick="openPanel('product', PRODUCTS.find(x => x.id === '${p.id}'))">
                <b>${p.name}</b>
                <small style="color:#38bdf8;">${p.type}</small>
                <div style="font-size:11px; color:#cbd5e1; margin-top:4px;">${p.price}</div>
              </div>
            `).join('')}
          </div>
        `;
      }
      else if (type === 'product') {
        const p = data;

    // ── 5. In-Drawer Mini 3D Preview ──
    function renderProduct3DPreview(p) {
      const host = document.getElementById('product-3d-host');
      if (!host) return;
      const s = new THREE.Scene();
      const c = new THREE.PerspectiveCamera(45, host.clientWidth / host.clientHeight, 0.1, 20);
      const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      r.setSize(host.clientWidth, host.clientHeight);
      host.appendChild(r.domElement);

      s.add(new THREE.HemisphereLight(0xffffff, 0x112233, 2.2));
      const group = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.8, 1.8, 32), createMat(p.color, 0.4, 0.3));
      group.add(body);
      const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.1, 1.1), createMat(0x0f172a, 0.5, 0.2));
      head.position.y = 1.3;
      group.add(head);
      s.add(group);

      c.position.set(3.2, 2.2, 4.2);
      c.lookAt(0, 0.5, 0);
      const orbit = new THREE.OrbitControls(c, r.domElement);
      orbit.enableDamping = true;

      function renderMini() {
        if (!host.isConnected) return;
        requestAnimationFrame(renderMini);
        orbit.update();
        group.rotation.y += 0.005;
        r.render(s, c);
      }
      renderMini();
    }

    // ── 6. Camera Navigation Utilities ──
    function resetCamera() {
      camera.position.set(9, 5.2, 11);
      controls.target.set(0, 1.5, 0);
    }
    function focusZone(zone) {
      if (zone === 'products') {
        camera.position.set(5.5, 3.2, 6.0);
        controls.target.set(0, 1.2, -1.5);
      } else {
        camera.position.set(7.5, 3.5, 6.5);
        controls.target.set(4.5, 1.0, 2.2);
      }
    }
    function toggleAutoTour() {
      autoTour = !autoTour;
    }
    function handleResize() {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }
    function animateLoop() {
      requestAnimationFrame(animateLoop);
      if (autoTour) {
        const time = Date.now() * 0.00015;
        camera.position.x = Math.sin(time) * 12;
        camera.position.z = Math.cos(time) * 12;
        camera.lookAt(0, 1.5, 0);
      }
      controls.update();
      hotspotMeshes.forEach((h, idx) => {
        h.rotation.z += 0.01 + idx * 0.001;
      });
      renderer.render(scene, camera);
    }
